console.log("[HauloutCore] Script evaluation started.");

let engineState = null;

function wheel(value, size, multiplier, offset) {
  const result = (value * multiplier + offset) % size;
  return result < 0 ? result + size : result;
}

// FNV-1a string hash -> 32-bit unsigned int, used as a PRNG seed.
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// mulberry32: small, fast, deterministic PRNG -- returns a function
// yielding successive floats in [0,1) from an integer seed.
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// A single deterministic pseudo-random float in [0,1) for a given
// key. Callers build the key out of exactly what should determine
// the outcome (typically sim-time and/or a seal number) plus a salt
// distinguishing this decision from any other drawn from the same
// time/seal, so unrelated choices don't move in lockstep off one
// shared draw.
function seededRandom(key) {
  return mulberry32(hashSeed(key))();
}

function generateId() {
  return 'hevt-xxxx-xxxx-4xxx-yxxx'.replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === 'x' ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

function isMatchingTime(dateA, dateB) {
  if (!dateA || !dateB) return false;
  const dA = new Date(dateA);
  const dB = new Date(dateB);
  return dA.getHours() === dB.getHours() && dA.getMinutes() === dB.getMinutes();
}

// SPEC §12: capacity-aware placement, now counting presences
// directly (one seal, one presence, one location) rather than
// emergences. Shore is unlimited and acts as the overflow pool.
//
// Deliberately unbiased: placement does NOT favor a seal's domicile.
// Dignity is read off wherever a seal actually lands, so outcomes
// are a genuine mix of dignified and undignified -- not
// self-fulfilling.
function allocateLocation(state, date, sealNumber) {
  const countAt = (name) => state.world.presences.filter(p => p.location === name).length;
  const capacityAt = (name) => getEffectiveCapacity(name, date);

  const withRoom = LOCATIONS.filter(loc => countAt(loc.name) < capacityAt(loc.name));
  const pool = withRoom.length > 0 ? withRoom : LOCATIONS.filter(loc => loc.capacity === Infinity);

  let minCount = Infinity;
  for (const loc of pool) {
    const count = countAt(loc.name);
    if (count < minCount) minCount = count;
  }

  const candidates = pool.filter(loc => countAt(loc.name) === minCount);
  const draw = sealNumber != null ? seededRandom(`location:${sealNumber}:${date.getTime()}`) : Math.random();
  return candidates[Math.floor(draw * candidates.length)].name;
}

// SPEC §5-9: catalogue generator. Produces a seal's six permanent
// properties (Number, Species, Sex, Mode, Temperament, Clan) via
// deterministic modular arithmetic (SPEC §6-8). Behaviour and
// Location are emergence properties, never seal properties (SPEC
// §23-24), so they are not generated here.
function generateSeal(number) {
  if (number < 1 || number > SEAL_COUNT) throw new RangeError("Seal number out of bounds.");
  const x = number - 1;
  const phase = Math.floor(x / 12);
  const decan = Math.floor(x / 10);

  return {
    number,
    species: SPECIES[wheel(x, 6, 5, 1)],
    sex: SEXES[wheel(x + phase, 2, 7, phase % 2)],
    mode: MODES[wheel(x, 3, 5, phase)],
    temperament: TEMPERAMENTS[wheel(x, 4, 11, phase + decan)],
    clan: CLANS[wheel(x, 7, 11, 3)]
  };
}

// SPEC §17: solar emergences select one seal per day via a hidden
// correspondence between seal number and the annual solar cycle.
// Dawn, Noon, Dusk and Midnight all share this daily solar seal.
function solarSeal(date) {
  const d = new Date(date);
  const startOfYear = new Date(d.getFullYear(), 0, 1);
  const dayOfYear = Math.floor((d - startOfYear) / DAY);
  return generateSeal(wheel(dayOfYear, SEAL_COUNT, 1, 0) + 1);
}

// Lunar counterpart to solarSeal(): maps a seal to the current
// position within the ~29.53-day lunar cycle, using a known new
// moon (2000-01-06 18:14 UTC) as the reference epoch.
const LUNAR_EPOCH = new Date(Date.UTC(2000, 0, 6, 18, 14, 0));

// Continuous 0..1 position in the lunar cycle (0 = New Moon,
// 0.5 = Full Moon), shared by lunarSeal, lunarPhase, and the
// busy/quiet arrival-rate driver below.
function moonAgeFraction(date) {
  const d = new Date(date);
  const daysSinceEpoch = (d - LUNAR_EPOCH) / DAY;
  const moonAge = ((daysSinceEpoch % LUNAR_CYCLE) + LUNAR_CYCLE) % LUNAR_CYCLE;
  return moonAge / LUNAR_CYCLE;
}

function lunarSeal(date) {
  const cyclePosition = Math.floor(moonAgeFraction(date) * SEAL_COUNT);
  return generateSeal(wheel(cyclePosition, SEAL_COUNT, 1, 0) + 1);
}

// One of the 8 classical lunar phases, from the same lunar age used
// by lunarSeal() above.
function lunarPhase(date) {
  const index = Math.round(moonAgeFraction(date) * 8) % 8;
  return LUNAR_PHASES[index];
}

// Busy/quiet: a wave over the lunar cycle, peaking at Full Moon and
// troughing at New Moon, raised to an exponent so it can hit
// genuinely near-zero (an empty coast) rather than just gently
// dipping around a baseline. Multiplies the base stochastic rate.
function busyQuietMultiplier(date) {
  const fraction = moonAgeFraction(date);
  const raw = (Math.cos(2 * Math.PI * (fraction - 0.5)) + 1) / 2; // 0 at New Moon, 1 at Full Moon
  const shaped = Math.pow(raw, CONFIG.busyQuietExponent);
  return shaped * CONFIG.busyQuietPeakMultiplier;
}

// Tide height, -1 (low) to 1 (high). Semidiurnal: one full cos cycle
// per half of tidePeriodMs, so two highs and two lows across the
// full 24h50m lunar day. Anchored to LUNAR_EPOCH as a simplification
// (a real tidal epoch would differ, but tides are loosely tied to
// lunar transit anyway, and reusing the existing epoch avoids an
// unexplained second reference point).
function tideHeight(date) {
  const halfPeriod = CONFIG.tidePeriodMs / 2;
  const elapsed = (new Date(date).getTime() - LUNAR_EPOCH.getTime()) % halfPeriod;
  const normalized = ((elapsed / halfPeriod) + 1) % 1;
  return Math.cos(2 * Math.PI * normalized);
}

function isHighTide(date) {
  return tideHeight(date) > CONFIG.tideHighThreshold;
}

// Spring tides cluster around New/Full Moon (Sun and Moon aligned,
// tidal forces reinforce); neap around the Quarters (at right
// angles, forces partially cancel). Classified by nearest point.
function isSpringTide(date) {
  const f = moonAgeFraction(date);
  const distToSpring = Math.min(f, Math.abs(f - 0.5), Math.abs(f - 1));
  const distToNeap = Math.min(Math.abs(f - 0.25), Math.abs(f - 0.75));
  return distToSpring < distToNeap;
}

// Current tide-adjusted capacity for a location. Only Shore and
// Iceberg are unaffected -- Small Rock, Mixed Rock, and Big Rock all
// respond (Iceberg is exempt by design: "never flooded").
function getEffectiveCapacity(locationName, date) {
  const loc = LOCATIONS.find(l => l.name === locationName);
  if (!loc) return Infinity;
  if (!isHighTide(date)) return loc.capacity;

  if (loc.category === "Small Rock" || loc.category === "Mixed Rock") return 0;
  if (loc.category === "Big Rock") return isSpringTide(date) ? 0 : 1;
  return loc.capacity;
}

// Weighted strength roll, used wherever strength isn't fixed
// (Stochastic, Morning) -- this is the literal mechanism by which a
// "head-emergence" Morning seal can occasionally get upgraded to Major.
function rollStrength(sealNumber, time, salt) {
  const weights = CONFIG.strengthWeights;
  const total = weights.MINOR + weights.MODERATE + weights.MAJOR;
  const draw = (sealNumber != null && time != null)
    ? seededRandom(`strength:${salt}:${sealNumber}:${time.getTime()}`)
    : Math.random();
  let r = draw * total;
  if (r < weights.MINOR) return "MINOR";
  r -= weights.MINOR;
  if (r < weights.MODERATE) return "MODERATE";
  return "MAJOR";
}

function createWorldState() {
  console.log("[HauloutCore] Creating fresh default world state.");
  return {
    version: VERSION,
    meta: {
      lastTick: null,
      lastSimTime: null,
      currentTime: null
    },
    currentSolarSeal: null,
    currentLunarSeal: null,
    // The querent's entrance point (see design discussion): three
    // sticky significators, each refreshed only at its own real
    // astronomical trigger and holding until the next one --
    // morning at the daily morning-seal-time, solar at each Dawn/
    // Noon/Dusk/Midnight/Phase-change, lunar at each Moonrise/
    // Moonset/Phase-change. A fourth, stochastic, deliberately has
    // no slot here -- it's cheap to recompute live for any given
    // moment (resolveStochasticSeal) and is supposed to never go
    // stale, so persisting it would just be a staleness bug waiting
    // to happen.
    querent: {
      morning: null,
      solar: null,
      lunar: null
    },
    // A single shared "since this morning" baseline for the domain
    // omens (Fortune trend, Turnover) -- domains don't have their
    // own significator/cast-moment the way querent charts do, so
    // rather than invent a new per-domain astronomical trigger, this
    // reuses the existing once-daily morning check as one global
    // "then" all three domains compare against.
    dayStart: {
      castAt: null,
      snapshot: null
    },
    world: {
      presences: [],
      activeEmergences: []
    },
    log: {
      scheduledEvents: [],
      notifications: [],
      journal: []
    },
    config: {
      stochasticRate: CONFIG.stochasticRateNeutralValue,
      morningSealTime: CONFIG.defaultMorningSealTime
    }
  };
}

function validateEnvironment(env) {
  if (!env) throw new Error("Environment reference is invalid.");
  if (!(env.time instanceof Date) || isNaN(env.time)) throw new Error("Environment clock is corrupted.");
}

function validateState(state) {
  if (!state) throw new Error("State structurally invalid.");
}

function getEngineState() {
  if (!engineState) engineState = createWorldState();
  return engineState;
}

function setEngineState(state) {
  console.log("[HauloutCore] Setting engine state:", state);
  engineState = state;
}

function tick(environment) {
  validateEnvironment(environment);
  const state = getEngineState();
  const nextState = {
    ...state,
    meta: { ...state.meta, currentTime: new Date(environment.time) },
    config: { ...state.config },
    querent: { ...state.querent },
    dayStart: { ...state.dayStart },
    world: {
      presences: state.world.presences.map(p => ({ ...p })),
      activeEmergences: state.world.activeEmergences.map(e => ({ ...e }))
    },
    log: {
      scheduledEvents: state.log.scheduledEvents.map(e => ({ ...e })),
      notifications: state.log.notifications.map(n => ({ ...n })),
      journal: state.log.journal.map(j => ({ ...j }))
    }
  };

  advanceWorld(nextState, environment);
  validateState(nextState);

  nextState.meta.lastSimTime = nextState.meta.currentTime ? nextState.meta.currentTime.getTime() : null;
  nextState.meta.lastTick = new Date();
  engineState = nextState;
  return nextState;
}

// Whether a location is currently icy, per its planet's retrograde
// cycle. Shores return false unconditionally (not in ICY_CYCLES).
// Iceberg returns true unconditionally -- the trans-Saturnian
// planets it stands in for spend the large majority of the year
// retrograde in reality, simplified here to "always."
function isLocationIcy(locationName, date) {
  if (locationName === "Iceberg") return true;
  const cycle = ICY_CYCLES[locationName];
  if (!cycle) return false;
  const daysSinceEpoch = Math.floor((new Date(date) - new Date(2026, 0, 1)) / DAY);
  const phase = ((daysSinceEpoch % cycle.cycleDays) + cycle.cycleDays) % cycle.cycleDays;
  return phase < cycle.icyDays;
}

// While a location is icy, emergences there pass 50% more slowly.
// Implemented by pushing each affected emergence's expiry and
// not-yet-fired lifecycle transitions later by an extra third of
// whatever sim-time just elapsed -- which works out to exactly 1.5x
// total duration if the location stays icy the whole time.
function applyIcyDilation(state, environment) {
  if (!state.meta.lastSimTime) return;
  const dt = environment.time.getTime() - state.meta.lastSimTime;
  if (dt <= 0) return;
  const extraDelay = dt / 3;

  const presenceByNumber = {};
  state.world.presences.forEach(p => { presenceByNumber[p.sealNumber] = p; });

  const icyEmergenceIds = new Set();
  state.world.activeEmergences.forEach(e => {
    const presence = presenceByNumber[e.sealNumber];
    if (presence && isLocationIcy(presence.location, environment.time)) {
      icyEmergenceIds.add(e.id);
      e.expires = new Date(e.expires.getTime() + extraDelay);
    }
  });

  state.log.scheduledEvents.forEach(ev => {
    if (ev.completed || ev.type !== "EMERGENCE_LIFECYCLE_TRANSITION") return;
    if (icyEmergenceIds.has(ev.payload.id)) {
      ev.executeAt = new Date(new Date(ev.executeAt).getTime() + extraDelay);
    }
  });
}

// Evicts any seal whose current location's effective (tide-adjusted)
// capacity is now below its occupancy -- e.g. small rocks going to
// zero capacity at high tide, or big rocks dropping to 1 (neap) or
// 0 (spring). Displaced seals move to whichever Shore is least
// crowded. Runs before new placements each tick so incoming seals
// see the already-corrected picture.
function applyTideEffects(state, environment) {
  const time = environment.time;
  LOCATIONS.forEach(loc => {
    if (loc.category === "Shore") return;
    const capacity = getEffectiveCapacity(loc.name, time);
    const occupants = state.world.presences.filter(p => p.location === loc.name);
    if (occupants.length <= capacity) return;

    const toEvict = occupants.slice(capacity);
    toEvict.forEach(p => {
      const newLocation = pickShoreForEviction(state);
      const oldLocation = p.location;
      p.location = newLocation;
      appendJournal(state, time, "Tide", `${formatSealName(p.seal)} was displaced from ${oldLocation} by the rising tide, moving to ${newLocation}.`, "SYSTEM");
    });
  });
}

function pickShoreForEviction(state) {
  const shores = LOCATIONS.filter(l => l.category === "Shore");
  const countAt = (name) => state.world.presences.filter(p => p.location === name).length;
  let minCount = Infinity;
  shores.forEach(s => { const c = countAt(s.name); if (c < minCount) minCount = c; });
  const candidates = shores.filter(s => countAt(s.name) === minCount);
  return candidates[Math.floor(Math.random() * candidates.length)].name;
}

function advanceWorld(state, environment) {
  state.currentSolarSeal = solarSeal(environment.time);
  state.currentLunarSeal = lunarSeal(environment.time);

  applyIcyDilation(state, environment);
  applyTideEffects(state, environment);
  executeScheduledEvents(state, environment);
  createEmergences(state, environment);
  recomputeCompany(state, environment.time);
  logNotableSynthesis(state, environment);
}

// Groups presences by location and recomputes each one's live
// "Company" points against its current neighbors.
function recomputeCompany(state, time) {
  const byLocation = {};
  state.world.presences.forEach(p => {
    if (!byLocation[p.location]) byLocation[p.location] = [];
    byLocation[p.location].push(p);
  });

  for (const locName in byLocation) {
    const capacity = getEffectiveCapacity(locName, time);
    const group = byLocation[locName];
    for (const presence of group) {
      presence.company = resolveCompany(presence, group, capacity);
    }
  }
}

function executeScheduledEvents(state, environment) {
  const currentSimTime = environment.time;
  const dueEvents = state.log.scheduledEvents.filter(e => new Date(e.executeAt) <= currentSimTime && !e.completed);
  state.log.scheduledEvents = state.log.scheduledEvents.filter(e => new Date(e.executeAt) > currentSimTime);

  dueEvents.sort((a, b) => new Date(a.executeAt) - new Date(b.executeAt));
  for (const event of dueEvents) {
    event.completed = true;
    if (event.type === "EMERGENCE_LIFECYCLE_TRANSITION") handleLifecycleTransition(state, event.payload, currentSimTime);
  }
}

// The Morning Seal is a distinct, human-imposed ritual -- NOT the
// same as the Solar Seal, and NOT deferred to or merged with Dawn
// Emergence. It fires unconditionally at the user's configured
// clock time (default 06:00), regardless of actual sunrise.
//
// How the Morning Seal should relate to the zodiacal/catalogue list
// is still undecided. For now it's a plain random draw -- a
// placeholder, not a considered design.
function resolveMorningSeal(time) {
  const draw = time != null ? seededRandom(`morning-seal:${time.getTime()}`) : Math.random();
  const randomSeed = Math.floor(draw * SEAL_COUNT) + 1;
  return generateSeal(randomSeed);
}

// The querent's fourth entrance, deliberately not persisted: "which
// seal would the stochastic background pick right now" for any given
// minute, using the exact same seed key createEmergences' actual
// fire-check draws from (stochastic-seal:${minuteKey}) -- so if a
// real Stochastic Emergence does fire this minute, this returns
// that same seal. Always resolvable, no probability gate, nothing to
// go stale.
function resolveStochasticSeal(time) {
  const minuteKey = Math.floor(time.getTime() / 60000);
  const randomSeed = Math.floor(seededRandom(`stochastic-seal:${minuteKey}`) * SEAL_COUNT) + 1;
  return generateSeal(randomSeed);
}

// A significator's delta is measured against "the whole state of
// the world" at the moment it was cast -- so casting one just means
// remembering which seal, when, and a copy of the two genuinely
// stateful/historical facts (presences, activeEmergences) that
// can't be recomputed from a timestamp alone. Everything else that
// could change (tide, icy status, lunar phase, busy/quiet) is a
// pure function of time and gets re-derived fresh at diff-time
// instead of copied here -- see diffWorldSnapshots.
function captureWorldSnapshot(state) {
  return {
    presences: state.world.presences.map(p => ({ ...p })),
    activeEmergences: state.world.activeEmergences.map(e => ({ ...e }))
  };
}

function castQuerentSignificator(state, slot, seal, time) {
  state.querent[slot] = {
    seal,
    castAt: new Date(time),
    snapshot: captureWorldSnapshot(state)
  };
}

function createEmergences(state, environment) {
  const currentSimTime = environment.time;

  if (state.meta.lastSimTime) {
    const prev = new Date(state.meta.lastSimTime);
    if (prev.getMinutes() === currentSimTime.getMinutes() && prev.getHours() === currentSimTime.getHours() && prev.getDate() === currentSimTime.getDate()) {
      return;
    }
  }

  // SPEC §17: Dawn, Noon, Dusk, Midnight (solar) and Moonrise, Moonset
  // (lunar) -- one shared shape, see SOLAR_LUNAR_TRIGGERS above.
  // Each firing also re-casts that slot's querent significator (see
  // castQuerentSignificator) -- the same seal, the same moment,
  // sticky until the next one of its kind.
  for (const trigger of SOLAR_LUNAR_TRIGGERS) {
    if (isMatchingTime(currentSimTime, environment[trigger.envKey])) {
      const seal = trigger.sealSource === "solar" ? state.currentSolarSeal : state.currentLunarSeal;
      triggerEmergence(state, EMERGENCE_TYPES[trigger.typeKey].type, "MODERATE", currentSimTime, seal);
      castQuerentSignificator(state, trigger.sealSource, seal, currentSimTime);
    }
  }

  // Phase Emergence -- fires whenever the moon crosses into a new
  // one of the 8 classical phases, independent of location (unlike
  // Moonrise/Moonset above, which are tied to environment.moonrise/
  // moonset -- this fires wherever the lunar seal currently is). A
  // phase change is also a lunar querent trigger, same as Moonrise/
  // Moonset.
  if (state.meta.lastSimTime && lunarPhase(currentSimTime) !== lunarPhase(new Date(state.meta.lastSimTime))) {
    triggerEmergence(state, EMERGENCE_TYPES.PHASE.type, "MODERATE", currentSimTime, state.currentLunarSeal);
    castQuerentSignificator(state, "lunar", state.currentLunarSeal, currentSimTime);
  }

  // Morning Emergence -- independent of Dawn, fires every day at
  // the user's configured time. Strength is rolled, not fixed: most
  // mornings it's a brief "head-emergence" (Minor), occasionally
  // upgraded all the way to Major. Seeded by the moment itself, not
  // rolled fresh -- the same morning always produces the same seal
  // and strength for everyone. Also casts the morning querent
  // significator, sticky until the next morning.
  if (state.config.morningSealTime) {
    const [targetHour, targetMin] = state.config.morningSealTime.split(":").map(Number);
    if (currentSimTime.getHours() === targetHour && currentSimTime.getMinutes() === targetMin) {
      const morningSeal = resolveMorningSeal(currentSimTime);
      triggerEmergence(state, EMERGENCE_TYPES.MORNING.type, rollStrength(morningSeal.number, currentSimTime, "MORNING"), currentSimTime, morningSeal);
      castQuerentSignificator(state, "morning", morningSeal, currentSimTime);
      state.dayStart = { castAt: new Date(currentSimTime), snapshot: captureWorldSnapshot(state) };
    }
  }

  // SPEC §19: Stochastic background. Rate is the base rate, modulated
  // by the lunar busy/quiet wave, further scaled by the Observatory's
  // rate control as a personal multiplier (its default value is
  // "neutral", i.e. 1x). Strength is rolled per arrival. The
  // fire-check and seal-pick draws are seeded by the exact minute --
  // everyone watching draws the same underlying number at that
  // minute, even though each viewer's own stochasticRate setting
  // (a personal preference, not a fact of the world) can still push
  // their own threshold above or below it.
  if (state.config.stochasticRate && state.config.stochasticRate > 0) {
    const personalMultiplier = state.config.stochasticRate / CONFIG.stochasticRateNeutralValue;
    const effectiveRate = CONFIG.stochasticBaseRatePerDay * busyQuietMultiplier(currentSimTime) * personalMultiplier;
    const minuteProbability = effectiveRate / 1440;
    const minuteKey = Math.floor(currentSimTime.getTime() / 60000);
    if (seededRandom(`stochastic-fire:${minuteKey}`) < minuteProbability) {
      const randomSeed = Math.floor(seededRandom(`stochastic-seal:${minuteKey}`) * SEAL_COUNT) + 1;
      const stochasticSeal = generateSeal(randomSeed);
      triggerEmergence(state, EMERGENCE_TYPES.STOCHASTIC.type, rollStrength(randomSeed, currentSimTime, "STOCHASTIC"), currentSimTime, stochasticSeal);
    }
  }
}

// A seal's "Placement" happiness at the moment it emerges is a
// running points total from every system that judges its clan and
// timing -- dignity and sect. Computed ONCE at trigger time and
// baked into duration, like a birth chart: fixed for the
// emergence's whole life, unaffected by who arrives later.
function resolveHappiness(sealInstance, location, time) {
  const factors = [];

  const dignity = CLAN_DIGNITY[sealInstance.clan];
  let dignityState = "Peregrine";
  if (dignity && location === dignity.domicile) dignityState = "Domicile";
  else if (dignity && location === dignity.detriment) dignityState = "Detriment";
  const dignityPointsFor = dignityState === "Domicile" ? CONFIG.dignityPoints.domicile
    : dignityState === "Detriment" ? CONFIG.dignityPoints.detriment : 0;
  // Display labels only -- kept distinct from dignityState above so
  // the point-lookup logic (and CLAN_DIGNITY's own domicile/
  // detriment property names) doesn't need touching, just what a
  // player actually reads.
  const dignityLabel = { Domicile: "Home Ground", Detriment: "Hostile Ground", Peregrine: "Neutral Ground" }[dignityState];
  factors.push({ label: dignityLabel, points: dignityPointsFor });

  const hour = new Date(time).getHours();
  const isDay = hour >= CONFIG.dayStartHour && hour < CONFIG.dayEndHour;
  const sealSect = sealInstance.sex === "Male" ? "Day" : "Night";
  const ofSect = (isDay ? "Day" : "Night") === sealSect;
  factors.push({ label: ofSect ? "In Rhythm" : "Out of Rhythm", points: ofSect ? CONFIG.sectPoints.ofSect : CONFIG.sectPoints.contrary });

  const points = factors.reduce((sum, f) => sum + f.points, 0);
  return { points, factors };
}

// "Company" happiness: the opposite of Placement -- LIVE, recomputed
// every tick from whoever currently shares the seal's location.
// Pairwise maxims (evaluated for this seal `a` against each other
// co-located seal `b`; deliberately directional where the real
// maxim is directional, e.g. only true seals feel Walrus unease).
// Tiers: Clan +/-2 (structural), everything else +/-1 (social/flavor).
// Stacking is intentional -- a Melancholic Elder in a crowd, or a
// Choleric neighbor who is also your temperamental opposite, are
// each meant to compound.
const RELATIONAL_PAIR_RULES = [
  { label: "Juveniles Together", points: 1, test: (a, b) => a.mode === "Juvenile" && b.mode === "Juvenile" },
  { label: "Mentoring a Juvenile", points: 1, test: (a, b) => a.mode === "Elder" && b.mode === "Juvenile" },

  { label: "Kindred Species", points: 1, test: (a, b) => a.species === b.species && a.species !== "Walrus" },
  { label: "Fellow Walrus", points: 2, test: (a, b) => a.species === "Walrus" && b.species === "Walrus" },
  { label: "Walrus Among Seals", points: -1, test: (a, b) => a.species !== "Walrus" && b.species === "Walrus" },

  { label: "Clan Loyalty", points: 2, test: (a, b) => a.clan === b.clan },
  { label: "Rival Clan", points: -2, test: (a, b) => CLAN_DIGNITY[a.clan] && CLAN_DIGNITY[a.clan].detriment === CLAN_DIGNITY[b.clan]?.domicile },

  { label: "Courtship", points: 1, test: (a, b) => a.sex !== b.sex },

  { label: "Temperamental Kinship", points: 1, test: (a, b) => a.temperament === b.temperament },
  { label: "Shared Humor", points: 1, test: (a, b) => a.temperament !== b.temperament && TEMPERAMENT_QUALITY[a.temperament] === TEMPERAMENT_QUALITY[b.temperament] },
  { label: "Humoral Clash", points: -1, test: (a, b) => TEMPERAMENT_OPPOSITE[a.temperament] === b.temperament },
  { label: "Unsettled by Choleric Neighbor", points: -1, test: (a, b) => b.temperament === "Choleric" }
];

// Pairwise maxims that compare current Behaviour, not permanent
// identity -- signature (a, b, behaviourA, behaviourB).
const RELATIONAL_BEHAVIOUR_RULES = [
  { label: "Shared Behaviour", points: 1, test: (ba, bb) => ba.type === bb.type },
  { label: "Disturbed Rest", points: -1, test: (ba, bb) => ba.type === "Sleep" && (bb.type === "Bark" || bb.type === "Play" || bb.type === "Fight" || bb.type === "Mate") }
];

// Solo maxims: about the seal's own nature versus how crowded its
// location is, independent of who specifically is there.
function resolveCompany(presence, colocatedPresences, locationCapacity) {
  const seal = presence.seal;
  const others = colocatedPresences.filter(p => p.sealNumber !== presence.sealNumber);
  const factors = [];

  for (const other of others) {
    const otherSeal = other.seal;
    for (const rule of RELATIONAL_PAIR_RULES) {
      if (rule.test(seal, otherSeal)) factors.push({ label: rule.label, points: rule.points, against: otherSeal });
    }
    for (const rule of RELATIONAL_BEHAVIOUR_RULES) {
      if (rule.test(presence.behaviour, other.behaviour)) factors.push({ label: rule.label, points: rule.points, against: otherSeal });
    }
  }

  const hasCompanions = others.length > 0;
  if (seal.mode === "Juvenile" && !hasCompanions) factors.push({ label: "Juvenile Alone", points: -1 });
  if (seal.mode === "Elder" && hasCompanions) factors.push({ label: "Elder Craves Solitude", points: -1 });
  if (seal.temperament === "Melancholic" && hasCompanions) factors.push({ label: "Melancholic Craves Solitude", points: -1 });

  const totalPresent = others.length + 1;
  if (isFinite(locationCapacity) && locationCapacity > 1 && totalPresent >= locationCapacity) factors.push({ label: "Overcrowded", points: -1 });

  const rawPoints = factors.reduce((sum, f) => sum + f.points, 0);
  const cap = CONFIG.relationalPointsCap;
  const points = Math.max(-cap, Math.min(cap, rawPoints));
  return { points, factors };
}

// One-word mood, summarizing Placement (happiness: dignity + sect,
// -3..+3) and Company (relational maxims, capped +/-
// CONFIG.relationalPointsCap) combined into a single qualitative
// read -- what the slim home cards show instead of raw point totals
// (those, and which factors drove them, stay in Readings). Combined
// range is roughly -7..+7; bands split it into five roughly equal
// thirds-of-that.
const MOOD_BANDS = [
  { max: -5, label: "Distressed" },
  { max: -2, label: "Unhappy" },
  { max: 1, label: "Tranquil" },
  { max: 4, label: "Happy" },
  { max: Infinity, label: "Ecstatic" }
];
function moodLabel(totalPoints) {
  return MOOD_BANDS.find(b => totalPoints <= b.max).label;
}

// Three-state collapse of the five mood bands above, for the
// front-page domain digest's dot code. Deliberately built on top of
// moodLabel/MOOD_BANDS rather than re-deriving its own point
// thresholds, so the two views can't drift out of sync.
const DOMAIN_STATUS_COLOR = {
  good: "#4d7d68",   // matches meetingColor's Friendly
  mixed: "#b8935a",
  bad: "#a8695c",    // matches meetingColor's Tense
  quiet: "var(--text-muted)"
};
function domainStatusFromMood(totalPoints) {
  const mood = moodLabel(totalPoints);
  if (mood === "Distressed" || mood === "Unhappy") return "bad";
  if (mood === "Tranquil") return "mixed";
  return "good"; // Happy, Ecstatic
}

// Aggregates each front-page domain's currently active presences
// (species membership from FRONT_PAGE_DOMAINS) into a single
// good/mixed/bad/quiet status. "Quiet" (no seals of that domain
// present right now) is distinct from "mixed" -- it's an absence of
// signal, not a neutral reading.
function computeDomainDigest(currentState) {
  const presences = currentState.world.presences || [];
  return FRONT_PAGE_DOMAINS.map(domain => {
    const inDomain = presences.filter(p => domain.species.includes(p.seal.species));
    if (inDomain.length === 0) {
      return { key: domain.key, label: domain.label, status: "quiet", color: DOMAIN_STATUS_COLOR.quiet };
    }
    const total = inDomain.reduce((sum, p) => sum + (p.happiness || { points: 0 }).points + (p.company || { points: 0 }).points, 0);
    const status = domainStatusFromMood(total / inDomain.length);
    return { key: domain.key, label: domain.label, status, color: DOMAIN_STATUS_COLOR[status] };
  });
}

// ============================================================
// DOMAIN OMENS -- five concepts read per domain, feeding the
// paragraph below each domain's top-level dot. Each pulls from a
// genuinely separate subsystem so they read as independent facts,
// not five phrasings of the same number:
//   Fortune    -- happiness level + trend (existing dot, now with
//                 direction, against the shared dayStart baseline)
//   Coherence  -- do dignity (place) and company (peers) agree,
//                 plus cross-location chronotype aspect
//   Turnover   -- arriving / staying / leaving, plus lifecycle mix
//                 of what stayed
//   Abundance  -- how many, trend, and share of total coast
//                 capacity, plus emergence strength mix
//   Kinship    -- aggregate RELATIONAL_PAIR_RULES points (kin vs.
//                 rivals) and species/clan diversity
// Structured facts only, no prose -- composing these into an actual
// reading is separate, later work.
// ============================================================

function presencesInDomain(presences, domain) {
  return presences.filter(p => domain.species.includes(p.seal.species));
}

function computeDomainFortune(domain, nowPresences, thenPresences) {
  const avgPoints = (list) => list.length === 0 ? null :
    list.reduce((sum, p) => sum + (p.happiness || { points: 0 }).points + (p.company || { points: 0 }).points, 0) / list.length;
  const nowAvg = avgPoints(nowPresences);
  const thenAvg = avgPoints(thenPresences);
  const level = nowAvg === null ? "quiet" : domainStatusFromMood(nowAvg);

  let trend = "unknown";
  if (nowAvg !== null && thenAvg !== null) {
    const delta = nowAvg - thenAvg;
    // Deadband of 0.5 before calling it a real move rather than
    // noise -- a first-pass threshold, not derived from anything.
    trend = delta > 0.5 ? "rising" : delta < -0.5 ? "falling" : "steady";
  } else if (nowAvg !== null && thenAvg === null) {
    trend = "rising"; // the domain went from nothing to something
  } else if (nowAvg === null && thenAvg !== null) {
    trend = "falling"; // the domain went from something to nothing
  }
  return { level, trend, nowAvg, thenAvg };
}

function computeDomainCoherence(domain, nowPresences) {
  if (nowPresences.length === 0) return { verdict: "quiet", avgGap: null, gapVerdict: null, friendlyPairs: 0, tensePairs: 0, aspectVerdict: "unknown" };

  const gaps = nowPresences.map(p => Math.abs((p.happiness || { points: 0 }).points - (p.company || { points: 0 }).points));
  const avgGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
  const gapVerdict = avgGap <= 1 ? "coherent" : avgGap <= 3 ? "mixed" : "discordant";

  let friendlyPairs = 0, tensePairs = 0;
  for (let i = 0; i < nowPresences.length; i++) {
    for (let j = i + 1; j < nowPresences.length; j++) {
      const a = nowPresences[i], b = nowPresences[j];
      if (a.location === b.location) continue; // co-located pairs read as "Together", not an aspect here
      const aspect = locationAspect(a.location, a.seal, b.location, b.seal);
      if (aspect === "Friendly") friendlyPairs++;
      else if (aspect === "Tense") tensePairs++;
    }
  }
  const aspectVerdict = (friendlyPairs === 0 && tensePairs === 0) ? "unknown"
    : friendlyPairs === tensePairs ? "mixed"
    : friendlyPairs > tensePairs ? "harmonious" : "discordant";

  return { avgGap, gapVerdict, friendlyPairs, tensePairs, aspectVerdict };
}

function computeDomainTurnover(domain, nowPresences, thenPresences, activeEmergences) {
  const thenIds = new Set(thenPresences.map(p => p.sealNumber));
  const nowIds = new Set(nowPresences.map(p => p.sealNumber));
  const arrived = nowPresences.filter(p => !thenIds.has(p.sealNumber));
  const departed = thenPresences.filter(p => !nowIds.has(p.sealNumber));
  const stayed = nowPresences.filter(p => thenIds.has(p.sealNumber));

  const lifecycleMix = { Active: 0, Peak: 0, Fading: 0 };
  stayed.forEach(p => {
    const em = activeEmergences.find(e => e.sealNumber === p.sealNumber);
    if (em && lifecycleMix[em.lifecycleState] !== undefined) lifecycleMix[em.lifecycleState]++;
  });

  return { arrived: arrived.length, departed: departed.length, stayed: stayed.length, lifecycleMix };
}

function computeDomainAbundance(domain, nowPresences, thenPresences, activeEmergences, date) {
  const totalCapacity = LOCATIONS.filter(l => l.category !== "Shore").reduce((sum, l) => sum + getEffectiveCapacity(l.name, date), 0);
  const fullness = totalCapacity > 0 ? nowPresences.length / totalCapacity : 0;
  const countTrend = nowPresences.length > thenPresences.length ? "rising" : nowPresences.length < thenPresences.length ? "falling" : "steady";

  const strengthMix = { Minor: 0, Moderate: 0, Major: 0 };
  nowPresences.forEach(p => {
    const em = activeEmergences.find(e => e.sealNumber === p.sealNumber);
    if (em && strengthMix[em.strength] !== undefined) strengthMix[em.strength]++;
  });

  return { count: nowPresences.length, countTrend, fullness, strengthMix };
}

const RELATIONAL_PAIR_LABELS = new Set(RELATIONAL_PAIR_RULES.map(r => r.label));
function computeDomainKinship(domain, nowPresences) {
  if (nowPresences.length === 0) return { verdict: "quiet", relationalPoints: 0, speciesDiversity: 0, clanDiversity: 0 };

  let relationalPoints = 0;
  nowPresences.forEach(p => {
    (p.company && p.company.factors ? p.company.factors : []).forEach(f => {
      if (RELATIONAL_PAIR_LABELS.has(f.label)) relationalPoints += f.points;
    });
  });

  const speciesDiversity = new Set(nowPresences.map(p => p.seal.species)).size;
  const clanDiversity = new Set(nowPresences.map(p => p.seal.clan)).size;
  const verdict = relationalPoints > 0 ? "kinship" : relationalPoints < 0 ? "strangeness" : "neutral";

  return { relationalPoints, speciesDiversity, clanDiversity, verdict };
}

function computeDomainOmens(domain, currentState) {
  const nowPresences = presencesInDomain(currentState.world.presences, domain);
  const thenPresences = currentState.dayStart.snapshot ? presencesInDomain(currentState.dayStart.snapshot.presences, domain) : [];
  const date = currentState.meta.currentTime || new Date();

  return {
    fortune: computeDomainFortune(domain, nowPresences, thenPresences),
    coherence: computeDomainCoherence(domain, nowPresences),
    turnover: computeDomainTurnover(domain, nowPresences, thenPresences, currentState.world.activeEmergences),
    abundance: computeDomainAbundance(domain, nowPresences, thenPresences, currentState.world.activeEmergences, date),
    kinship: computeDomainKinship(domain, nowPresences)
  };
}

// Turnover and Abundance are numeric-only so far (counts, fullness
// fraction) -- these give them the same kind of qualitative verdict
// Fortune/Coherence/Kinship already have, so a summary can be built
// with no numbers at all. Gathering/Scattering/Steady is the
// arriving-vs-leaving framing from the drafting session; Abundance's
// bands are a first-pass split, not derived from anything.
function turnoverVerdict(t) {
  if (t.arrived === 0 && t.departed === 0 && t.stayed === 0) return "quiet";
  if (t.arrived > t.departed) return "gathering";
  if (t.departed > t.arrived) return "scattering";
  return "steady";
}

function abundanceLevel(a) {
  if (a.count === 0) return "empty";
  if (a.fullness >= 1) return "overflowing";   // tide-closed rocks can push this past what's normally possible -- see the fullness comment above
  if (a.fullness >= 0.66) return "full";
  if (a.fullness >= 0.33) return "moderate";
  return "sparse";
}

// The actual card-facing text: every concept's qualitative verdict,
// no numbers, joined into one plain paragraph. Deliberately not
// "voice" -- no register, no compression, no selection of which
// fact matters most (that's Stage 3/4, separate later work). This
// just says everything the five concepts found, plainly.
function summarizeDomainQualitatively(omens) {
  if (omens.fortune.level === "quiet") return "Nothing stirring here right now.";
  const f = omens.fortune, c = omens.coherence, t = omens.turnover, a = omens.abundance, k = omens.kinship;
  return [
    `Fortune is ${f.level}${f.trend !== "unknown" ? ` and ${f.trend}` : ""}.`,
    `Coherence is ${c.gapVerdict}, and the wider aspect reads ${c.aspectVerdict}.`,
    `Turnover is ${turnoverVerdict(t)}.`,
    `Abundance is ${abundanceLevel(a)}.`,
    `Kinship leans toward ${k.verdict}.`
  ].join(" ");
}

// A querent significator's delta against "the whole state of the
// world": everything genuinely stateful (who arrived/departed/
// stayed, which emergences are new/resolved) comes from comparing
// the cast-time snapshot's presences/activeEmergences against the
// live ones by sealNumber/id. Everything else that could change
// (lunar phase, the busy/quiet wave) is a pure function of time, so
// it's re-derived fresh for both moments here rather than carried
// in the snapshot -- see captureWorldSnapshot's comment for why.
function diffWorldSnapshots(then, now) {
  const thenIds = new Set(then.presences.map(p => p.sealNumber));
  const nowIds = new Set(now.presences.map(p => p.sealNumber));
  const thenEmergenceIds = new Set(then.activeEmergences.map(e => e.id));
  const nowEmergenceIds = new Set(now.activeEmergences.map(e => e.id));

  return {
    arrived: now.presences.filter(p => !thenIds.has(p.sealNumber)),
    departed: then.presences.filter(p => !nowIds.has(p.sealNumber)),
    stayed: now.presences.filter(p => thenIds.has(p.sealNumber)),
    newEmergences: now.activeEmergences.filter(e => !thenEmergenceIds.has(e.id)),
    resolvedEmergences: then.activeEmergences.filter(e => !nowEmergenceIds.has(e.id))
  };
}

// Full delta for one querent significator (or null if that slot
// hasn't been cast yet -- e.g. a fresh game before the first Dawn/
// Noon/morning-time has occurred). currentTime is passed in rather
// than read off currentState internally so this stays a pure
// function of its arguments, easy to test without a live tick.
function computeQuerentDelta(significator, currentState, currentTime) {
  if (!significator) return null;
  const now = { presences: currentState.world.presences, activeEmergences: currentState.world.activeEmergences };
  const worldDelta = diffWorldSnapshots(significator.snapshot, now);
  return {
    seal: significator.seal,
    castAt: significator.castAt,
    ...worldDelta,
    lunarPhaseThen: lunarPhase(significator.castAt),
    lunarPhaseNow: lunarPhase(currentTime),
    busyQuietThen: busyQuietMultiplier(significator.castAt),
    busyQuietNow: busyQuietMultiplier(currentTime)
  };
}

// Stage 2 cleaning: a raw emergence list over-counts by sealNumber,
// since one seal can pick up more than one clock-triggered
// emergence (Phase + Moonset, say) in the same window without
// anything new actually having happened to it. This collapses that
// down to "how many distinct seals," which is the honest number --
// see the drafting-session finding that "3 new emergences" can
// really mean one new seal plus two re-tags of one already here.
function distinctSealCount(emergences) {
  return new Set(emergences.map(e => e.sealNumber)).size;
}

// Stage 3 (selection) and Stage 4 (voice) are deliberately not
// attempted here -- this just enumerates every fact a delta
// contains, unranked and unstyled, so there's something concrete to
// look at and draft against. Not meant to be shown to a player as-is.
function listQuerentFacts(chartName, delta) {
  if (!delta) return [`${chartName}: not yet cast.`];
  return [
    `${chartName} significator: Seal #${delta.seal.number}, ${delta.seal.species}, ${delta.seal.clan} Clan, ${delta.seal.sex}, ${delta.seal.temperament}.`,
    `Cast at: ${delta.castAt.toISOString()}.`,
    `Presences now: ${delta.stayed.length + delta.arrived.length} (${delta.stayed.length} since cast, ${delta.arrived.length} new).`,
    `Departed since cast: ${delta.departed.length}.`,
    `New emergences: ${delta.newEmergences.length} (${distinctSealCount(delta.newEmergences)} distinct seals).`,
    `Resolved emergences: ${delta.resolvedEmergences.length} (${distinctSealCount(delta.resolvedEmergences)} distinct seals).`,
    `Lunar phase at cast: ${delta.lunarPhaseThen}.`,
    `Lunar phase now: ${delta.lunarPhaseNow}.`,
    `Busy/quiet at cast: ${delta.busyQuietThen.toFixed(2)}.`,
    `Busy/quiet now: ${delta.busyQuietNow.toFixed(2)}.`
  ];
}

// Stochastic has no cast moment and no delta -- see
// resolveStochasticSeal's comment. Its facts are present-tense only.
function listStochasticFacts(currentState, currentTime) {
  const seal = resolveStochasticSeal(currentTime);
  const presentNow = currentState.world.presences.length;
  return [
    `stochastic significator: Seal #${seal.number}, ${seal.species}, ${seal.clan} Clan, ${seal.sex}, ${seal.temperament}.`,
    `Resolved for: ${currentTime.toISOString()} (this minute only -- no cast moment, no history).`,
    `Presences right now: ${presentNow}.`,
    `Lunar phase right now: ${lunarPhase(currentTime)}.`,
    `Busy/quiet right now: ${busyQuietMultiplier(currentTime).toFixed(2)}.`
  ];
}

// Rather than a dedicated querent section, the four charts surface
// by marking their significator's own existing seal card wherever
// it's already showing on the coast -- and, if it's since resolved,
// a faded "ghost" card at wherever it was last seen. A presence's
// location never changes once allocated (see allocateLocation), so
// its cast-time location IS its last-known location -- no separate
// tracking needed, the snapshot already has it.
// Stochastic has no snapshot to fall back on (see
// resolveStochasticSeal's comment) -- if it's not live right now,
// it has nothing to show, by design, so it never produces a ghost.
const QUERENT_FRESH_CHECK = { solar: solarSeal, lunar: lunarSeal };
function locateQuerentSignificators(currentState, currentTime) {
  const results = [];
  [["morning", currentState.querent.morning], ["solar", currentState.querent.solar], ["lunar", currentState.querent.lunar]].forEach(([chart, sig]) => {
    if (!sig) return;
    const live = currentState.world.presences.find(p => p.sealNumber === sig.seal.number);
    if (live) {
      // Solar/lunar identity is continuous and can drift well before
      // the next real recast (lunarSeal shifts roughly every two
      // hours; recast points -- Moonrise/Moonset/Phase -- are a day
      // or more apart). A LIVE card wearing the lunar badge is an
      // active claim ("this individual represents the moon right
      // now") -- if fresh astronomy disagrees with what was cast,
      // that claim is false, so it's shown as stochastic instead.
      // Ghosts below are exempt from this: a ghost is already
      // inherently retrospective ("who this was at the last lunar
      // event"), so it keeps its real label regardless of what's
      // true now -- that history is the whole point of tracking it.
      const freshCheck = QUERENT_FRESH_CHECK[chart];
      const stale = freshCheck && freshCheck(currentTime).number !== sig.seal.number;
      results.push({ chart: stale ? "stochastic" : chart, sealNumber: sig.seal.number, seal: sig.seal, status: "present", location: live.location });
    } else {
      const wasAt = sig.snapshot.presences.find(p => p.sealNumber === sig.seal.number);
      if (wasAt) results.push({ chart, sealNumber: sig.seal.number, seal: sig.seal, status: "ghost", location: wasAt.location });
    }
  });

  const stochasticSeal = resolveStochasticSeal(currentTime);
  const liveStochastic = currentState.world.presences.find(p => p.sealNumber === stochasticSeal.number);
  if (liveStochastic) {
    results.push({ chart: "stochastic", sealNumber: stochasticSeal.number, seal: stochasticSeal, status: "present", location: liveStochastic.location });
  }

  return results;
}

// Plain enumeration of a domain's five omens -- no ranking, no
// prose, same spirit as listQuerentFacts: something concrete to
// look at and draft against, not meant to be shown to a player as-is.
function listDomainOmenFacts(domain, omens) {
  const f = omens.fortune, c = omens.coherence, t = omens.turnover, a = omens.abundance, k = omens.kinship;
  return [
    `${domain.label}`,
    `Fortune: ${f.level}, trend ${f.trend}${f.nowAvg !== null ? ` (now avg ${f.nowAvg.toFixed(2)}${f.thenAvg !== null ? `, was ${f.thenAvg.toFixed(2)}` : ""})` : ""}.`,
    `Coherence: dignity/company gap ${c.avgGap !== null ? c.avgGap.toFixed(2) : "n/a"} (${c.gapVerdict || "n/a"}); cross-location aspect ${c.friendlyPairs} friendly / ${c.tensePairs} tense (${c.aspectVerdict}).`,
    `Turnover: ${t.arrived} arrived, ${t.stayed} stayed, ${t.departed} departed. Stayed lifecycle mix: Active ${t.lifecycleMix.Active}, Peak ${t.lifecycleMix.Peak}, Fading ${t.lifecycleMix.Fading}.`,
    `Abundance: ${a.count} present, trend ${a.countTrend}, ${(a.fullness * 100).toFixed(0)}% of total coast capacity. Strength mix: Minor ${a.strengthMix.Minor}, Moderate ${a.strengthMix.Moderate}, Major ${a.strengthMix.Major}.`,
    `Kinship: ${k.relationalPoints} relational points (${k.verdict}); ${k.speciesDiversity} distinct species, ${k.clanDiversity} distinct clans present.`
  ];
}

// Which emergence category a seal's card icon shows -- Stochastic is
// deliberately aniconic (it's the "no particular reason" category by
// design, so it gets no particular icon).
const CATEGORY_ICON = { SOLAR: "\u2600\uFE0F", LUNAR: "\u{1F319}", MORNING: "\u{1F305}", STOCHASTIC: "" };

// The current lunar phase BIASES which solo behaviour is more
// likely, it doesn't determine it. Social behaviours only enter the
// pool at all when `others` is non-empty (2+ seals at the location),
// and are unweighted among themselves -- deliberately not biased by
// phase, Placement, or Company, so surprising outcomes stay possible
// (a happy pair can still roll Fight). When social, a specific
// partner is picked from `others` so both sides can display who
// they're doing it with.
function resolveBehaviour(time, others, sealNumber) {
  const matched = BEHAVIOUR_BY_PHASE[lunarPhase(time)];
  const weighted = [];
  SOLO_BEHAVIOURS.forEach(b => {
    const weight = b === matched ? CONFIG.behaviourPhaseBiasWeight : 1;
    for (let i = 0; i < weight; i++) weighted.push({ type: b });
  });
  if (others.length > 0) {
    SOCIAL_BEHAVIOURS.forEach(b => weighted.push({ type: b, social: true }));
  }
  const seeded = sealNumber != null;
  const behaviourDraw = seeded ? seededRandom(`behaviour:${sealNumber}:${time.getTime()}`) : Math.random();
  const choice = weighted[Math.floor(behaviourDraw * weighted.length)];
  if (choice.social) {
    const partnerDraw = seeded ? seededRandom(`partner:${sealNumber}:${time.getTime()}`) : Math.random();
    const partner = others[Math.floor(partnerDraw * others.length)];
    return { type: choice.type, partnerNumber: partner.sealNumber };
  }
  return { type: choice.type };
}

// SPEC §15, §20-23: creates an emergence referencing exactly one
// seal. Strength and Persistence belong to the emergence; Location,
// Behaviour and Placement belong to the seal's PRESENCE (overriding
// SPEC §23's claim that Behaviour belongs to the emergence -- a
// seal can only be doing one thing at a time, even with several
// concurrent emergences).
function triggerEmergence(state, type, strengthKey, time, sealInstance) {
  const emergenceId = generateId();
  const strength = STRENGTHS[strengthKey] || STRENGTHS.MODERATE;

  // Persistence is variable within the strength's band -- like a
  // transit, not a fixed length. Sampled log-uniformly so short and
  // long durations within the band are equally likely in scale.
  // Seeded by the seal and moment, so the same seal triggering at
  // the same time always gets the same duration.
  const sampledDuration = Math.exp(
    Math.log(strength.minDurationMs) + seededRandom(`duration:${sealInstance.number}:${time.getTime()}:${type}`) * (Math.log(strength.maxDurationMs) - Math.log(strength.minDurationMs))
  );

  // A seal is the primary noun and can carry several concurrent
  // emergences (meanings), but it is only ever in one physical
  // location at a time -- reuse its existing Presence if it has one.
  // Placement is unbiased (see allocateLocation) so dignity outcomes
  // are a genuine mix, not self-fulfilling, and it's fixed for the
  // whole Presence (like a birth chart) -- inherited here, not
  // recalculated with each new emergence's trigger time.
  let presence = state.world.presences.find(p => p.sealNumber === sealInstance.number);
  const location = presence ? presence.location : allocateLocation(state, time, sealInstance.number);
  const happiness = presence ? presence.happiness : resolveHappiness(sealInstance, location, time);

  // Behaviour is resolved fresh each time -- it's fine for a new
  // emergence to update what the seal is currently doing. Social
  // behaviours only enter the pool with other seals already here,
  // and are reciprocal -- both sides end up referencing each other.
  const othersHere = state.world.presences.filter(p => p.location === location && p.sealNumber !== sealInstance.number);
  const behaviour = resolveBehaviour(time, othersHere, sealInstance.number);

  if (presence) {
    presence.behaviour = behaviour;
  } else {
    presence = {
      sealNumber: sealInstance.number,
      seal: sealInstance,
      location,
      behaviour,
      happiness,
      company: { points: 0, factors: [] },
      arrivedAt: new Date(time)
    };
    state.world.presences.push(presence);
    recordSealEncounter(sealInstance.number, location, time);
  }

  if (behaviour.partnerNumber != null) {
    const partnerPresence = state.world.presences.find(p => p.sealNumber === behaviour.partnerNumber);
    if (partnerPresence) {
      partnerPresence.behaviour = { type: behaviour.type, partnerNumber: sealInstance.number };
    }
  }

  const finalDuration = sampledDuration * (1 + happiness.points * CONFIG.happinessDurationWeight);

  const happinessSummary = happiness.factors.map(f => f.label).join(", ");
  console.log(`[HauloutCore] Triggering ${strength.label} emergence (${type}) for Seal #${sealInstance.number} [${happinessSummary}, ${happiness.points >= 0 ? "+" : ""}${happiness.points}]. Duration: ${formatMsToReadable(finalDuration)}`);

  state.world.activeEmergences.push({
    id: emergenceId,
    type,
    strength: strength.label,
    sealNumber: sealInstance.number,
    lifecycleState: "Active",
    created: new Date(time),
    expires: new Date(time.getTime() + finalDuration)
  });

  const category = TYPE_TO_CATEGORY[type] || "STOCHASTIC";

  // Notification text: Dawn and Moonrise announce the relevant
  // body's zodiacal position (Moonrise also announces the lunar
  // phase); Morning is just a plain daily greeting for now;
  // everything else (including Stochastic) uses the generic form.
  let title, body;
  if (type === EMERGENCE_TYPES.DAWN.type) {
    const pos = calculateZodiac(time, SOLAR_YEAR);
    title = `${formatSealName(sealInstance)} [${strength.label}]`;
    body = `The sun rises in ${pos.sign}, ${pos.degree}\u00b0. ${type} at ${location}. Duration: ${formatMsToReadable(finalDuration)}`;
  } else if (type === EMERGENCE_TYPES.MOONRISE.type) {
    const pos = calculateZodiac(time, SIDEREAL_MONTH);
    const phase = lunarPhase(time);
    title = `${formatSealName(sealInstance)} [${strength.label}]`;
    body = `The moon rises in ${pos.sign}, ${pos.degree}\u00b0, in its ${phase} phase. ${type} at ${location}. Duration: ${formatMsToReadable(finalDuration)}`;
  } else if (type === EMERGENCE_TYPES.MORNING.type) {
    title = "Good Morning";
    body = `It is ${new Date(time).toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`;
  } else {
    title = `${formatSealName(sealInstance)} [${strength.label}]`;
    body = `${type} at ${location}. Duration: ${formatMsToReadable(finalDuration)}`;
  }

  state.log.notifications.unshift({
    id: generateId(),
    timestamp: new Date(time),
    type: category,
    title: `\u{1F9AD} ${title}`,
    body,
    read: false
  });

  appendJournal(
    state, time, "Seal Surface",
    `${formatSealName(sealInstance)} (${sealInstance.sex}, ${sealInstance.mode}, ${sealInstance.temperament}, ${sealInstance.clan} Clan) -- ${strength.label} ${type} at ${location}.`,
    category
  );

  const scheduleEvent = (offset, targetState) => {
    state.log.scheduledEvents.push({
      id: generateId(),
      executeAt: new Date(time.getTime() + offset),
      type: "EMERGENCE_LIFECYCLE_TRANSITION",
      payload: { id: emergenceId, targetState },
      completed: false
    });
  };

  scheduleEvent(finalDuration * CONFIG.lifecycleFractions.peak, "Peak");
  scheduleEvent(finalDuration * CONFIG.lifecycleFractions.fading, "Fading");
  scheduleEvent(finalDuration, "Resolved");
  state.log.scheduledEvents.sort((a, b) => new Date(a.executeAt) - new Date(b.executeAt));
}

// Removes a seal's Presence once none of its emergences remain
// active -- the seal physically leaves the coast.
function removePresenceIfNoLongerActive(state, sealNumber) {
  const stillActive = state.world.activeEmergences.some(e => e.sealNumber === sealNumber);
  if (!stillActive) {
    state.world.presences = state.world.presences.filter(p => p.sealNumber !== sealNumber);
  }
}

function handleLifecycleTransition(state, payload, time) {
  const idx = state.world.activeEmergences.findIndex(e => e.id === payload.id);
  if (idx === -1) return;
  const em = state.world.activeEmergences[idx];
  em.lifecycleState = payload.targetState;
  console.log(`[HauloutCore] Emergence ${payload.id} shifted state to: ${payload.targetState}`);

  if (em.lifecycleState === "Resolved") {
    state.world.activeEmergences.splice(idx, 1);
    appendJournal(state, time, "Emergence Resolved", `The ${em.strength} ${em.type} has subsided.`, "SYSTEM");
    removePresenceIfNoLongerActive(state, em.sealNumber);
  }
}

function forceResolveEmergence(state, emergenceId) {
  const idx = state.world.activeEmergences.findIndex(e => e.id === emergenceId);
  if (idx !== -1) {
    const em = state.world.activeEmergences[idx];
    state.world.activeEmergences.splice(idx, 1);
    removePresenceIfNoLongerActive(state, em.sealNumber);
  }
  state.log.scheduledEvents = state.log.scheduledEvents.filter(e => e.payload?.id !== emergenceId);
}

// Developer/Observatory override (ARCHITECTURE §22 OBS-003): still
// only constructs an emergence via triggerEmergence(), no alternate
// logic path.
function forceCategorizedEmergence(state, category, customSealId) {
  const time = state.meta.currentTime || new Date();
  const explicitNumber = parseInt(customSealId, 10);
  const customSeal = (!isNaN(explicitNumber) && explicitNumber >= 1 && explicitNumber <= SEAL_COUNT) ? generateSeal(explicitNumber) : null;
  const randomSeal = () => customSeal || generateSeal(Math.floor(Math.random() * SEAL_COUNT) + 1);

  if (category === "SOLAR") {
    triggerEmergence(state, EMERGENCE_TYPES.DAWN.type, "MODERATE", time, customSeal || solarSeal(time));
  } else if (category === "LUNAR") {
    triggerEmergence(state, EMERGENCE_TYPES.MOONRISE.type, "MODERATE", time, customSeal || lunarSeal(time));
  } else if (category === "MORNING") {
    triggerEmergence(state, EMERGENCE_TYPES.MORNING.type, rollStrength(), time, randomSeal());
  } else {
    triggerEmergence(state, EMERGENCE_TYPES.STOCHASTIC.type, rollStrength(), time, randomSeal());
  }
}

function updateStochasticRate(state, rate) {
  state.config.stochasticRate = Math.max(0, Math.min(5, rate));
}

function updateMorningSealTime(state, timeString) {
  if (/^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/.test(timeString)) {

}

function appendJournal(state, timestamp, title, text, category) {

}

// Utility string formatter transforming large millisecond numbers into scannable timestamps
function formatMsToReadable(ms) {
  const totalMinutes = Math.floor(ms / 60000);
  if (totalMinutes < 60) return `${totalMinutes}m`;

  const totalHours = Math.floor(totalMinutes / 60);
  if (totalHours < 24) return `${totalHours}h`;

  const totalDays = Math.floor(totalHours / 24);
  if (totalDays < 30) return `${totalDays}d`;

  return `1mo`;
}

console.log("[HauloutUI] Script evaluation started.");

let state = null;
let simTimeMs = Date.now();
let lastRealTime = Date.now();
let lastSaveTime = Date.now();
let timeMultiplier = 1;
let observatoryInitialized = false;
let isRunning = false;

// Asks the browser (not this chat session) for the actual device's
// location, so sunrise/sunset/moonrise/moonset reflect wherever the
// person actually is. Fire-and-forget: doesn't block startup, and
// the placeholder scheme keeps working in the meantime. Once
// resolved, clears the astronomical cache and re-polls so the
// display picks up real times immediately rather than waiting for
// the calendar day to change.
function requestUserLocation() {
  if (!navigator.geolocation) {
    window.__bootLog && window.__bootLog('Geolocation not available in this browser -- using placeholder sun/moon times.');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (position) => {
      userLocation = { lat: position.coords.latitude, lon: position.coords.longitude };
      astronomicalCache = { dateKey: null, lat: null, lon: null };
      window.__bootLog && window.__bootLog(`Location acquired (${userLocation.lat.toFixed(2)}, ${userLocation.lon.toFixed(2)}) -- switching to real sun/moon times.`);
      if (isRunning) poll();
    },
    (err) => {
      window.__bootLog && window.__bootLog(`Geolocation unavailable (${err.message}) -- using placeholder sun/moon times.`);
    },
    { timeout: 10000, maximumAge: 3600000 }
  );
}

function start() {
  if (isRunning) {
    console.log("[HauloutUI] start() was called, but application loop is already active. Bailing.");
    return;
  }

  window.__bootLog && window.__bootLog('start() called.');
  console.log("[HauloutUI] Initializing loop sequence.");
  isRunning = true;
  requestUserLocation();

  try {
    window.__bootLog && window.__bootLog('Loading state...');
    const loadedState = loadState();
    setEngineState(loadedState);
    window.__bootLog && window.__bootLog('State loaded OK.');

    sealDex = loadSealDex();
    window.__bootLog && window.__bootLog('Sealdex loaded OK.');

    if (loadedState && loadedState.meta && loadedState.meta.currentTime) {
      simTimeMs = new Date(loadedState.meta.currentTime).getTime();
    } else {
      simTimeMs = Date.now();
    }

    lastRealTime = Date.now();
    lastSaveTime = Date.now();

    window.__bootLog && window.__bootLog('Calling first poll()...');
    poll();
    window.__bootLog && window.__bootLog('First poll() completed OK.');

    setInterval(poll, 1000);
    setupUIEventListeners();
    window.__bootLog && window.__bootLog('Event listeners bound. Startup complete.');
    console.log("[HauloutUI] Initialization loop bound successfully.");
  } catch (err) {
    window.__bootLog && window.__bootLog('FATAL in start(): ' + err.name + ': ' + err.message + '\n' + (err.stack || ''));
    console.error("[HauloutUI] Critical failure during startup sequence:", err);
  }
}

// ARCHITECTURE §7-8: Environment. When the browser has granted
// geolocation (see requestUserLocation() in start()), sunrise,
// sunset, solar noon/midnight, and moonrise/moonset are all real,
// computed for that location -- not developer placeholders. Falls
// back to the old fixed-hour placeholder scheme if location is
// unavailable or hasn't resolved yet.
function readEnvironment(specificTime) {
  const simTime = specificTime || new Date(simTimeMs);

  if (userLocation) {
    const astro = getAstronomicalTimesForDay(simTime, userLocation.lat, userLocation.lon);
    return {
      time: simTime,
      sunrise: astro.sunrise,
      sunset: astro.sunset,
      solarNoon: astro.solarNoon,
      solarMidnight: astro.solarMidnight,
      moonrise: astro.moonrise,
      moonset: astro.moonset,
      solarPosition: calculateZodiac(simTime, SOLAR_YEAR),
      lunarPosition: calculateZodiac(simTime, SIDEREAL_MONTH)
    };
  }

  const y = simTime.getFullYear(), m = simTime.getMonth(), d = simTime.getDate();
  const sunrise = new Date(y, m, d, CONFIG.dayStartHour, 0, 0);
  const sunset = new Date(y, m, d, CONFIG.dayEndHour, 0, 0);
  const nextSunrise = new Date(sunrise.getTime() + DAY);
  return {
    time: simTime,
    sunrise,
    sunset,
    solarNoon: new Date((sunrise.getTime() + sunset.getTime()) / 2),
    solarMidnight: new Date((sunset.getTime() + nextSunrise.getTime()) / 2),
    moonrise: new Date(y, m, d, 22, 0, 0),
    moonset: new Date(y, m, d, 10, 0, 0),
    solarPosition: calculateZodiac(simTime, SOLAR_YEAR),
    lunarPosition: calculateZodiac(simTime, SIDEREAL_MONTH)
  };
}

function poll() {
  const nowReal = Date.now();
  const deltaReal = nowReal - lastRealTime;
  lastRealTime = nowReal;

  const previousSimTime = new Date(simTimeMs);
  simTimeMs += deltaReal * timeMultiplier;
  const currentSimTime = new Date(simTimeMs);

  if (timeMultiplier > 1) {
    let runner = new Date(previousSimTime.getTime());
    let safety = 0;
    while (runner < currentSimTime && safety < 1440) {
      runner.setMinutes(runner.getMinutes() + 1);
      if (runner > currentSimTime) break;
      tick(readEnvironment(runner));
      safety++;
    }
  }

  const env = readEnvironment(currentSimTime);
  state = tick(env);

  if (nowReal - lastSaveTime >= CONFIG.autosaveInterval) {
    saveState(state);
    lastSaveTime = nowReal;
  }

  render(state, env);
}

function formatCountdown(ms) {
  if (ms <= 0) return "Reached";
  const totalSecs = Math.floor(ms / 1000);
  const h = Math.floor(totalSecs / 3600);
  const m = Math.floor((totalSecs % 3600) / 60);
  const s = totalSecs % 60;
  return `${h > 0 ? h + "h " : ""}${m}m ${s}s`;
}

function formatTimestamp(ts) {
  const d = new Date(ts);
  return `${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
}

// Long-run figures over the full recorded journal history -- however
// much of it actually exists yet, described honestly by its real
// span rather than assumed to be a year. Category/strength counts
// are scoped to "Seal Surface" entries specifically (the only ones
// that carry a real emergence category and a strength in their
// text); Tide/Resolved are counted separately since they're a
// different kind of entry.
function journalStats(journal) {
  if (journal.length === 0) return null;
  const timestamps = journal.map(j => new Date(j.timestamp).getTime());
  const earliest = Math.min(...timestamps), latest = Math.max(...timestamps);
  const spanDays = Math.max(1, Math.round((latest - earliest) / DAY));

  const surfaceEntries = journal.filter(j => j.title === "Seal Surface");
  const categoryCounts = { SOLAR: 0, LUNAR: 0, MORNING: 0, STOCHASTIC: 0 };
  const strengthCounts = { Minor: 0, Moderate: 0, Major: 0 };
  surfaceEntries.forEach(j => {
    if (categoryCounts[j.category] !== undefined) categoryCounts[j.category]++;
    const afterDash = j.text.split("-- ")[1];
    const strengthWord = afterDash ? afterDash.split(" ")[0] : null;
    if (strengthWord && strengthCounts[strengthWord] !== undefined) strengthCounts[strengthWord]++;
  });

  const dayCounts = {};
  surfaceEntries.forEach(j => {
    const day = new Date(j.timestamp).toISOString().slice(0, 10);
    dayCounts[day] = (dayCounts[day] || 0) + 1;
  });
  let busiestDay = null, busiestCount = 0;
  Object.entries(dayCounts).forEach(([day, count]) => { if (count > busiestCount) { busiestDay = day; busiestCount = count; } });

  return {
    total: journal.length,
    earliest: new Date(earliest), latest: new Date(latest), spanDays,
    surfaceCount: surfaceEntries.length,
    categoryCounts, strengthCounts,
    tideCount: journal.filter(j => j.title === "Tide").length,
    resolvedCount: journal.filter(j => j.title === "Emergence Resolved").length,
    synthesisCount: journal.filter(j => j.category === "SYNTHESIS").length,
    busiestDay, busiestCount
  };
}
