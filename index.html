<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Haulout Architecture Sandbox</title>
    <style>
* { box-sizing: border-box; }

:root {
  --bg-primary: #dfe9e3;
  --bg-secondary: #cfdcd4;
  --accent: #3f6b58;
  --accent-muted: #7fa593;
  --text-main: #2c3e40;
  --text-muted: #6b7d82;
  --border-color: #b7c7c0;
  --sky-top: #eef3f0;
  --sky-bottom: #cfd9d4;
  --sea-top: #7f9a9c;
  --sea-bottom: #47606a;
  --sky-top-night: #2a3538;
  --sky-bottom-night: #1c2528;
  --sea-top-night: #384c50;
  --sea-bottom-night: #131b1d;
  --sun-color: #d9a15b;
  --moon-light: #e9e6d6;
  --rock-color: #5a6b64;
  --iceberg-color: #d3e9ee;
  --shore-color: #7d9088;
}

html {
  height: 100%;
  overflow: hidden;
}

body {
  margin: 0; 
  font-family: monospace; 
  font-size: 15px;
  background-color: var(--bg-primary); 
  color: var(--text-main);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

.app-header {
  background: var(--bg-primary);
  padding: 0.75rem 1.5rem; 
  display: flex; 
  justify-content: space-between; 
  align-items: center;
  height: 50px;
  box-sizing: border-box;
  flex-shrink: 0;
  letter-spacing: 0.1em;
}

.clock-display {
  font-size: 0.85rem; 
  color: var(--text-muted);
}

#horizon-hero {
  width: 100%;
  height: 170px;
  overflow: hidden;
  display: block;
  flex-shrink: 0;
  position: relative;
}
#horizon-svg { width: 100%; height: 100%; display: block; }
.sky-body {
  position: absolute;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  pointer-events: none;
}
#sun-glyph { background: var(--sun-color); }

#tab-screens {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  box-sizing: border-box;
  padding: 1rem 1.5rem;
}

.tab-screen.hidden { display: none; }

.coast-grid {
  display: flex;
  flex-direction: column;
  gap: 0.75rem; 
  margin-top: 5px;
}

.domain-digest {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}
.domain-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 4px;
  padding: 8px 9px;
  box-sizing: border-box;
}
.domain-card-head {
  display: flex;
  align-items: center;
  gap: 6px;
}
.domain-dot {
  flex-shrink: 0;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}
.domain-card-label {
  font-size: 12px;
  font-weight: bold;
  color: var(--text-main);
  line-height: 1.2;
}
.domain-card-stub {
  margin: 4px 0 0 0;
  font-size: 12px;
  font-style: normal;
  color: var(--text-muted);
  line-height: 1.4;
}

#bottom-tab-bar {
  display: flex;
  flex-shrink: 0;
  border-top: 1px solid var(--border-color);
  background: var(--bg-primary);
}
.tab-btn {
  flex: 1;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 0.03em;
  color: var(--text-muted);
  padding: 12px 2px;
  cursor: pointer;
}
.tab-btn.active { color: var(--text-main); border-bottom-color: var(--accent); }

.collapsible-section { border-bottom: 1px solid var(--border-color); }
.accordion-header { color: var(--accent); margin: 14px 0 4px 0; font-weight: bold; font-size:14px; }
.accordion-content { padding-bottom: 8px; }

.btn {
  background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--accent); border-radius: 4px; padding: 4px 8px; cursor: pointer;
}
.btn-sm { font-size: 14px; padding: 2px 4px; }
.block-btn { width: 100%; }
.hidden { display: none !important; }

.badge { display: inline-block; border-radius: 2px; font-weight: bold; }
.badge.status-active { background: #cfe3d8; color: #2c3e40; } /* matches AGE_COLOR.Juvenile */
.badge.status-peak { background: #3f6b58; color: #eef3f0; } /* matches AGE_COLOR.Adult */
.badge.status-fading { background: #7d8c88; color: #2c3e40; } /* matches AGE_COLOR.Elder */
    </style>
</head>
<body>
    <header class="app-header">
        <div><strong>HAULOUT</strong></div>
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="clock-display" id="sim-clock">Awaiting Engine Core...</div>
            <button id="debug-toggle" title="Debug" style="width:9px; height:9px; padding:0; border-radius:50%; background:#333; border:1px solid #555; opacity:0.35; cursor:pointer;"></button>
        </div>
    </header>
    <div id="horizon-hero">
        <svg id="horizon-svg" viewBox="0 0 1000 170" preserveAspectRatio="none">
            <defs>
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop id="sky-stop-top" offset="0%" style="stop-color:var(--sky-top)"/>
                    <stop id="sky-stop-bottom" offset="100%" style="stop-color:var(--sky-bottom)"/>
                </linearGradient>
                <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop id="sea-stop-top" offset="0%" style="stop-color:var(--sea-top)"/>
                    <stop id="sea-stop-bottom" offset="100%" style="stop-color:var(--sea-bottom)"/>
                </linearGradient>
            </defs>
            <rect x="0" y="0" width="1000" height="170" fill="url(#skyGrad)"/>
            <!-- Horizon line: a gentle, irregular swell rather than a
                 ruler-straight edge -- the one deliberate wave-shaped
                 divider in the page, everything below it is sea/rock. -->
            <path d="M0,108 Q125,100 250,107 T500,106 T750,109 T1000,105 L1000,170 L0,170 Z" fill="url(#seaGrad)"/>
            <!-- Every named LOCATION, left to right in the same order
                 as the coast-viewport (see LOCATIONS). Each rock's
                 opacity is set live in renderHorizon() from its real
                 tide-adjusted capacity -- fully submerged fades
                 nearly out, partially reduced (a Big Rock at ordinary
                 high tide) dims partway, Shores and Iceberg are never
                 tide-reduced so always render at full opacity. Not
                 purely decorative any more; this is the same
                 mechanic the coast-viewport cards use. -->
            <ellipse id="deco-near-shore" cx="-20" cy="115" rx="90" ry="30" fill="var(--shore-color)"/>
            <ellipse id="deco-big-smooth" cx="160" cy="111" rx="32" ry="10" fill="var(--rock-color)"/>
            <ellipse id="deco-big-sharp" cx="290" cy="113" rx="30" ry="9" fill="var(--rock-color)"/>
            <ellipse id="deco-mixed" cx="420" cy="116" rx="20" ry="7" fill="var(--rock-color)"/>
            <polygon id="deco-iceberg" points="530,118 550,95 570,102 585,118" fill="var(--iceberg-color)"/>
            <ellipse id="deco-small-smooth" cx="680" cy="117" rx="16" ry="6" fill="var(--rock-color)"/>
            <ellipse id="deco-small-sharp" cx="800" cy="118" rx="15" ry="6" fill="var(--rock-color)"/>
            <ellipse id="deco-far-shore" cx="1020" cy="115" rx="90" ry="30" fill="var(--shore-color)"/>
        </svg>
        <!-- Sun and Moon live outside the SVG above on purpose -- that
             SVG is deliberately stretched non-uniformly
             (preserveAspectRatio="none") to fill the banner, which
             turns true circles into ovals. These are positioned via
             renderHorizon() as a CSS overlay (left%/top-px) instead,
             so they stay circular regardless of the banner's aspect
             ratio. -->
        <div id="sun-glyph" class="sky-body"></div>
        <svg id="moon-glyph" class="sky-body" viewBox="0 0 40 40">
            <defs>
                <clipPath id="moonClip"><circle cx="20" cy="20" r="16"/></clipPath>
            </defs>
            <circle cx="20" cy="20" r="16" fill="var(--moon-light)"/>
            <!-- Shadow circle clipped to the moon disc's own boundary
                 -- without this it previously rendered as two loose,
                 independent ovals instead of a single moon with a
                 phase-shaped bite out of it. -->
            <g clip-path="url(#moonClip)">
                <circle id="moon-shadow-circle" cx="20" cy="20" r="16" fill="var(--sky-bottom)"/>
            </g>
        </svg>
    </div>
    <main id="tab-screens">
        <section id="screen-home" class="tab-screen">
            <div id="domain-digest" class="domain-digest"></div>
            <div id="coast-viewport" class="coast-grid"></div>
        </section>

        <section id="screen-sealdex" class="tab-screen hidden">
            <div id="sealdex-panel"></div>
        </section>

        <section id="screen-readings" class="tab-screen hidden">
            <div id="readings-panel"></div>
        </section>

        <section id="screen-journal" class="tab-screen hidden">
            <div id="notifications-wrap" style="padding:10px 10px 0 10px;">
                <h3 style="margin:0 0 8px 0; font-size:16px; color:var(--accent);">Notifications</h3>
                <div id="notifications-viewport"></div>
            </div>
            <div id="journal-panel"></div>
        </section>
    </main>

    <nav id="bottom-tab-bar">
        <button class="tab-btn active" data-tab="home">Home</button>
        <button class="tab-btn" data-tab="sealdex">Sealdex</button>
        <button class="tab-btn" data-tab="readings">Readings</button>
        <button class="tab-btn" data-tab="journal">Journal</button>
    </nav>

    <!-- CORE SCRIPT PIPELINE (combined: data.js + haulout.js + ui.js) -->
    <div id="debug-panel" class="hidden" style="position:fixed; top:50px; right:0; bottom:0; width:320px; max-width:90vw; overflow-y:auto; background:var(--bg-secondary); border-left:1px solid var(--border-color); z-index:9999; padding:10px; box-sizing:border-box;">
        <h3 style="margin:0 0 8px 0; font-size:15px; color:var(--accent);">Debug</h3>
        <div id="observatory-panel"></div>
        <hr style="border-color:var(--border-color); margin:12px 0;">
        <button id="boot-log-copy" style="font-size:13px; background:#111; color:#4ade80; border:1px solid #4ade80; padding:2px 6px; cursor:pointer; margin-bottom:6px;">Copy Log</button>
        <div id="boot-log" style="width:100%; max-height:260px; overflow:auto; background:rgba(0,0,0,0.9); color:#4ade80; font-family:monospace; font-size:13px; padding:8px; border:1px solid #4ade80; white-space:pre-wrap; line-height:1.4; box-sizing:border-box;"></div>
    </div>

    <script>
      // Runs before the main script -- catches literally anything,
      // including errors on the main script's very first line.
      (function() {
        var lines = [];
        function bootLog(msg) {
          lines.push(msg);
          var el = document.getElementById('boot-log');
          if (el) el.textContent = lines.join('\n');
          console.log('[BOOT]', msg);
        }
        window.__bootLog = bootLog;

        bootLog('Page parsed. UA: ' + navigator.userAgent);
        try {
          localStorage.setItem('__haulout_probe__', '1');
          localStorage.removeItem('__haulout_probe__');
          bootLog('localStorage: OK');
        } catch (e) {
          bootLog('localStorage: FAILED - ' + e.name + ': ' + e.message);
        }

        window.addEventListener('error', function(e) {
          bootLog('WINDOW ERROR: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '?') + ':' + (e.colno || '?') + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
        });
        window.addEventListener('unhandledrejection', function(e) {
          bootLog('UNHANDLED REJECTION: ' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)));
        });

        document.getElementById('boot-log-copy').addEventListener('click', function() {
          const text = lines.join('\n');
          const btn = document.getElementById('boot-log-copy');
          const original = btn.textContent;
          if (!navigator.clipboard) return;
          navigator.clipboard.writeText(text)
            .catch(function() {
              btn.textContent = 'Copy failed (no permission)';
              setTimeout(function() { btn.textContent = original; }, 1500);
            });
        });
        document.getElementById('debug-toggle').addEventListener('click', function() {
          document.getElementById('debug-panel').classList.toggle('hidden');
        });
      })();
    </script>

    <script>
    // ============================================================
    // data.js - Immutable Configuration (SPECIFICATION.md Parts I-II)
    // ============================================================
window.__bootLog && window.__bootLog('Main script tag reached and executing.');
const VERSION = "0.5.0";
const DAY = 86400000;
const LUNAR_CYCLE = 29.53059; // synodic month -- phase (New Moon -> New Moon)
const SIDEREAL_MONTH = 27.32166; // sidereal month -- Moon's position against the zodiac
const SOLAR_YEAR = 365.24219;
const SEAL_COUNT = 360;

const CONFIG = {
  autosaveInterval: 30000,
  dayStartHour: 6,
  dayEndHour: 18,
  // Each net happiness point shifts duration by this fraction (see
  // resolveHappiness()). E.g. +2 points -> 1 + 2*0.15 = 1.3x duration.
  happinessDurationWeight: 0.15,
  // How much more likely the lunar-phase-matched behaviour is,
  // relative to each of the other 7 behaviours (a bias, not a rule --
  // e.g. 3 means the matched behaviour is 3x as likely as any other single one).
  behaviourPhaseBiasWeight: 3,
  // Live "Company" points (relational maxims, recomputed every tick)
  // are capped at +/- this, kept separate from the baked-in
  // "Placement" points (dignity + sect) so crowding can't swamp everything.
  relationalPointsCap: 4,
  // "Placement" happiness (see resolveHappiness()): points for
  // landing in a clan's domicile/detriment location, and for
  // arriving during/against the seal's sect (day/night).
  dignityPoints: { domicile: 2, detriment: -2 },
  sectPoints: { ofSect: 1, contrary: -1 },
  // Emergence lifecycle (Active->Peak->Fading->Resolved): fraction of
  // total duration elapsed at each transition. An emergence starts
  // Active immediately (no separate Approaching state) -- Peak and
  // Fading are the only transitions to schedule. Shared by the
  // engine's scheduling (triggerEmergence) and the UI's countdown
  // display (render) -- change here, not in both places.
  lifecycleFractions: { peak: 0.5, fading: 0.8 },
  // Default target clock time for the daily Morning Emergence, used
  // both for a fresh world state and as the Observatory's displayed
  // fallback before state has loaded.
  defaultMorningSealTime: "06:00",
  // Weighted strength roll, used by any trigger whose strength isn't
  // fixed (Stochastic, Morning) -- Major deliberately tiny: given its
  // multi-day duration, even a small fraction compounds (via arrival
  // rate x duration) into "always several around," which kills the
  // rarity. ~1% keeps it a genuine, occasional upgrade.
  strengthWeights: { MINOR: 70, MODERATE: 29, MAJOR: 1 },
  // Base stochastic arrival rate (per day) at NEUTRAL busyness
  // (New/Full Moon multiplier applies on top of this). The
  // Observatory's rate control still works as a personal multiplier
  // on this base -- its default value (2) is "neutral" (1x).
  stochasticBaseRatePerDay: 8,
  stochasticRateNeutralValue: 2,
  // Busy/quiet shaping: raw wave (0 at New Moon, 1 at Full Moon) is
  // raised to this exponent before scaling by the peak multiplier --
  // higher exponent = longer near-empty trough, sharper peak, rather
  // than gently bobbing around a baseline.
  busyQuietPeakMultiplier: 5,
  busyQuietExponent: 2.5,
  // Tides: semidiurnal, two highs per 24h50m (the lunar day, not the
  // solar one -- real tides run on the Moon's transit, not the Sun's).
  // Threshold shapes how wide the "currently high tide" window is
  // around each peak (cosine height, -1..1); 0.85 gives roughly a
  // ~2 hour window either side of peak out of each ~12h25m half-cycle.
  tidePeriodMs: (24 * 60 + 50) * 60 * 1000,
  tideHighThreshold: 0.85
};

// --- Catalogue Generator (SPEC §8) ---
// Species: wheel(x,6,5,1) -> exactly 60 seals each
const SPECIES = ["Grey", "Harbour", "Harp", "Ringed", "Hooded", "Walrus"];

// Species doubles as house signification (SPEC has no equivalent --
// designer's addition): the one seal trait fixed permanently at
// generation and otherwise unused, playing the role real charts give
// houses -- a domain of life a placement is read through, independent
// of and unrelated to the planetary/zodiacal meanings above (Clan
// dignity, Sect, Temperament, Aspect). Loosely based on the 12
// classical houses, not a 1:1 map (6 species) and not paired
// oppositions the way CLAN_DIGNITY's domicile/detriment is -- each
// species gets one primary signification. Secondaries are chosen
// independently of the classical house-pairings (deliberately not
// mirroring them, e.g. HEALTH sits under COVERT rather than beside
// WORK the way 6th-house tradition would put them together). Grey/
// SELF has no secondary on purpose -- rich enough alone, the root
// the others radiate from rather than a peer with its own pairing.
const SPECIES_SIGNIFICATION = {
  Grey: { primary: "SELF", secondary: null },
  Harbour: { primary: "HOME", secondary: "MONEY" },
  Harp: { primary: "LOGISTICS", secondary: "WORK" },
  Ringed: { primary: "COVERT", secondary: "HEALTH" },
  Hooded: { primary: "LOVE", secondary: "GROUPS" },
  Walrus: { primary: "OTHER", secondary: "REGARD" }
};

// What each signification keyword above actually means, spelled
// out -- the keyword alone (e.g. "SELF") reads as a bare label;
// this is what a reading or the Sealdex guide actually says.
const SIGNIFICATION_GLOSS = {
  SELF: "the self, on its own terms",
  OTHER: "another individual, faced directly",
  HOME: "home and belonging",
  MONEY: "what's owned, what's spent",
  LOGISTICS: "the practical journey, getting somewhere",
  WORK: "routine, the daily grind",
  COVERT: "what's hidden, kept out of sight",
  HEALTH: "the body's hidden processes",
  LOVE: "romance and courtship",
  GROUPS: "community, shared ventures",
  REGARD: "reputation, how something is seen"
};

// Full unpacked description for a species' signification, primary
// (and secondary, if any) run together as one phrase -- what
// composeDelineation's domain clause and the Sealdex guide both
// draw from, instead of either one showing bare keywords.
function describeSpeciesSignification(sig) {
  const primaryDesc = SIGNIFICATION_GLOSS[sig.primary];
  return sig.secondary ? `${primaryDesc}, or ${SIGNIFICATION_GLOSS[sig.secondary]}` : primaryDesc;
}

// The three home-screen digest domains -- Haulout's six species
// significations paired down along an outward-material /
// outward-social / inward-personal axis. Used only by the front-page
// digest cards; the Sealdex, Synthesis, and Readings views still show
// all six significations at full native resolution.
const FRONT_PAGE_DOMAINS = [
  { key: "practical", label: "Practical Life", species: ["Harbour", "Harp"] },
  { key: "relationships", label: "Relationships", species: ["Hooded", "Walrus"] },
  { key: "self", label: "Self & Hidden", species: ["Grey", "Ringed"] }
];

// Sex: wheel(x+phase,2,7,phase%2) -> exactly 180 seals each
const SEXES = ["Male", "Female"];
// Mode/Age: wheel(x,3,5,phase) -> exactly 120 seals each
const MODES = ["Juvenile", "Adult", "Elder"];
// Mode as individual signification -- an energy/readiness gloss,
// independent of Temperament, consistent with (not a departure from)
// the existing Company maxims below (Juvenile Alone, Elder Craves
// Solitude already imply this same reading).
const MODE_SIGNIFICATION = {
  Juvenile: "untested, eager, restless without company",
  Adult: "capable, established, comfortable carrying its own weight",
  Elder: "settled, set in its ways, has earned its solitude"
};
// Temperament: wheel(x,4,11,phase+decan) -> exactly 90 seals each
const TEMPERAMENTS = ["Sanguine", "Phlegmatic", "Choleric", "Melancholic"];
// Temperament as individual signification -- personality, the level
// people actually read a sign at (nobody says "you're Fire"). The
// classical Hot/Cold/Wet/Dry humor mechanics below are the
// infrastructure this is built on, not the delineation itself --
// kept separate on purpose, not merged into or derived from this.
const TEMPERAMENT_SIGNIFICATION = {
  Sanguine: "sociable, enthusiastic, easily excited, optimistic to a fault",
  Choleric: "driven, decisive, quick to act and quick to anger, impatient with delay",
  Melancholic: "reflective, cautious, detail-minded, prone to worry",
  Phlegmatic: "steady, easygoing, conflict-averse, slow to stir and slow to stop"
};
// Classical hot/cold quality and full oppositions, used by relational maxims.
const TEMPERAMENT_QUALITY = { Sanguine: "Hot", Choleric: "Hot", Melancholic: "Cold", Phlegmatic: "Cold" };
const TEMPERAMENT_OPPOSITE = { Sanguine: "Melancholic", Melancholic: "Sanguine", Choleric: "Phlegmatic", Phlegmatic: "Choleric" };
// Clan: wheel(x,7,11,3) -> approximately equal
const CLANS = ["Storm", "Mist", "Ice", "Ancient", "Tide", "Moon", "Sun"];

// Seed vocabulary for the Sealdex tag editor (long TBD, per the
// label that used to sit there). Four themes, all fixed/always-known
// traits -- no history needed to offer them, unlike dignity or
// chronotype which depend on where a seal happens to be sitting.
// suggestedTagsForSeal surfaces only one seal's own four value-groups
// (~20 words) out of the full ~100-word bank, not the whole thing.
const TAG_VOCAB_TEMPERAMENT = {
  Sanguine: ["warm", "buoyant", "sociable", "impulsive", "easygoing", "quick-to-laugh"],
  Phlegmatic: ["calm", "steady", "unhurried", "reserved", "imperturbable", "mild"],
  Choleric: ["driven", "fierce", "restless", "commanding", "headstrong", "quick-tempered"],
  Melancholic: ["wary", "private", "precise", "brooding", "exacting", "pensive"]
};
const TAG_VOCAB_MODE = {
  Juvenile: ["playful", "green", "eager", "unsettled", "curious", "untested"],
  Adult: ["capable", "grounded", "assured", "dependable", "purposeful", "in-their-prime"],
  Elder: ["weathered", "patient", "storied", "slow", "wise", "set-in-their-ways"]
};
const TAG_VOCAB_CLAN = {
  Sun: ["radiant", "open", "forthright", "generous", "self-assured"],
  Moon: ["changeable", "introspective", "private", "tidal", "receptive"],
  Mist: ["elusive", "ambiguous", "unreadable", "quicksilver", "in-between"],
  Ancient: ["traditional", "storied", "unhurried", "rooted", "dignified"],
  Tide: ["rhythmic", "restless", "cyclical", "insistent", "drawn-elsewhere"],
  Ice: ["cold", "resilient", "unyielding", "isolate", "enduring"],
  Storm: ["volatile", "intense", "sudden", "electric", "unpredictable"]
};
const TAG_VOCAB_SIGNIFICATION = {
  Grey: ["singular", "introspective", "self-contained", "private", "independent"],
  Harbour: ["domestic", "rooted", "careful", "provident", "house-proud"],
  Harp: ["industrious", "orderly", "dutiful", "efficient", "methodical"],
  Ringed: ["secretive", "elusive", "guarded", "watchful", "hidden"],
  Hooded: ["devoted", "tender", "sociable", "communal", "affectionate"],
  Walrus: ["watchful", "image-conscious", "proud", "outward-facing", "reputation-minded"]
};
function suggestedTagsForSeal(seal) {
  return [...new Set([
    ...(TAG_VOCAB_TEMPERAMENT[seal.temperament] || []),
    ...(TAG_VOCAB_MODE[seal.mode] || []),
    ...(TAG_VOCAB_CLAN[seal.clan] || []),
    ...(TAG_VOCAB_SIGNIFICATION[seal.species] || [])
  ])];
}

// --- Geography (SPEC §11-12), doubling as the seven classical
// planets, plus Iceberg -- an eighth place standing in for the
// trans-Saturnian planets (Uranus/Neptune/Pluto), added outside the
// SPEC's original seven. Shores are the luminaries; Mixed is

// Meeting between two (location, seal) pairs -- what a player sees;
// internally still resolved from location/sect exactly as before.
// Together if the same location; Apart specifically for the two
// Shores (the one fixed relationship between them, settled
// independent of chronotype -- distinct from ordinary tension
// between rocks); otherwise Friendly if same chronotype or Tense if
// opposite -- chronotype resolved per-location where fixed
// (LOCATION_SECT), falling back to the seal's own where not (Restless
// Ledge, Iceberg).
function locationAspect(locA, sealA, locB, sealB) {
  if (locA === locB) return "Together";
  const shores = new Set(["Near Shore", "Far Shore"]);
  if (shores.has(locA) && shores.has(locB)) return "Apart";
  const sectOf = (loc, seal) => LOCATION_SECT[loc] || (seal.sex === "Male" ? "Day" : "Night");
  return sectOf(locA, sealA) === sectOf(locB, sealB) ? "Friendly" : "Tense";
}

// never overwrites a person's manual appellation/tags/notes.
function recordSealEncounter(sealNumber, location, time) {
  const existing = sealDex[sealNumber] || {};
  const locationCounts = { ...(existing.locationCounts || {}) };
  locationCounts[location] = (locationCounts[location] || 0) + 1;

  sealDex[sealNumber] = {
    appellation: existing.appellation || null,
    tags: existing.tags || [],
    notes: existing.notes || "",
    timesSeen: (existing.timesSeen || 0) + 1,
    firstSeen: existing.firstSeen || new Date(time).toISOString(),
    lastSeen: new Date(time).toISOString(),
    locationCounts
  };
  saveSealDex();
}

// live name for social behaviours (reciprocal -- partner might have

function formatBehaviourLabel(presence, state) {
  const b = presence.behaviour;
  const verb = SOCIAL_VERBS[b.type];
  if (verb) {

// POSITION display and announcement text -- never for seal identity
// (SPEC §1 excludes zodiacal signs from the seal vocabulary itself).
// Ecliptic longitude 0 degrees (start of Aries) is defined at the
// March equinox, not January 1 -- using Jan 1 as the zero-point here
// was a real bug, not a simplification: it shifted every zodiac
// position (solar and lunar both, since they share this function) by
// roughly 2 signs, e.g. reporting the Sun in Libra during real Leo
// season. 2026's March equinox: March 20, 2026, 14:46 UTC (NASA/
// timeanddate.com). Not re-derived per year since this whole system
// already treats the tropical year length as a fixed average
// (SOLAR_YEAR) rather than solving for the true equinox each time --
// a several-hour equinox drift year to year is well within that same
// tolerance.
const ECLIPTIC_EPOCH = new Date(Date.UTC(2026, 2, 20, 14, 46, 0));

function calculateZodiac(date, period) {
  const d = new Date(date);
  const diffDays = (d - ECLIPTIC_EPOCH) / DAY;
  let longitude = ((diffDays / period) * 360) % 360;
  if (longitude < 0) longitude += 360;
  return {
    sign: ZODIAC[Math.floor(longitude / 30)].sign,
    degree: parseFloat((longitude % 30).toFixed(1)),
    longitude: parseFloat(longitude.toFixed(1))
  };
}

// ============================================================
// Real astronomy: sunrise/sunset/solar noon (NOAA/Meeus solar
// position algorithm) and moonrise/moonset (Meeus low-precision
// lunar position + horizon-crossing search). Validated against
// published reference data for London, 2026-03-20: computed
// 06:02/18:12 UTC vs published 06:04/18:13 UTC (within ~1-2 min).
// Lunar side validated by internal consistency (new moon rises
// within minutes of sunrise; full moon rises near sunset), since
// external reference tables proved hard to pin to a specific year.
// ============================================================
function deg2rad(d) { return d * Math.PI / 180; }
function rad2deg(r) { return r * 180 / Math.PI; }
function julianDay(date) { return (date.getTime() / 86400000) + 2440587.5; }

function solarSunriseSunset(date, lat, lon) {
  const JD = julianDay(date);
  const JC = (JD - 2451545) / 36525;
  const geomMeanLongSun = (280.46646 + JC * (36000.76983 + JC * 0.0003032)) % 360;
  const geomMeanAnomSun = 357.52911 + JC * (35999.05029 - 0.0001537 * JC);
  const eccentEarthOrbit = 0.016708634 - JC * (0.000042037 + 0.0000001267 * JC);
  const sunEqCtr = Math.sin(deg2rad(geomMeanAnomSun)) * (1.914602 - JC * (0.004817 + 0.000014 * JC))
    + Math.sin(deg2rad(2 * geomMeanAnomSun)) * (0.019993 - 0.000101 * JC)
    + Math.sin(deg2rad(3 * geomMeanAnomSun)) * 0.000289;
  const sunTrueLong = geomMeanLongSun + sunEqCtr;
  const sunAppLong = sunTrueLong - 0.00569 - 0.00478 * Math.sin(deg2rad(125.04 - 1934.136 * JC));
  const meanObliqEcliptic = 23 + (26 + ((21.448 - JC * (46.815 + JC * (0.00059 - JC * 0.001813)))) / 60) / 60;
  const obliqCorr = meanObliqEcliptic + 0.00256 * Math.cos(deg2rad(125.04 - 1934.136 * JC));
  const sunDeclin = rad2deg(Math.asin(Math.sin(deg2rad(obliqCorr)) * Math.sin(deg2rad(sunAppLong))));
  const varY = Math.tan(deg2rad(obliqCorr / 2)) * Math.tan(deg2rad(obliqCorr / 2));
  const eqOfTime = 4 * rad2deg(
    varY * Math.sin(2 * deg2rad(geomMeanLongSun))
    - 2 * eccentEarthOrbit * Math.sin(deg2rad(geomMeanAnomSun))
    + 4 * eccentEarthOrbit * varY * Math.sin(deg2rad(geomMeanAnomSun)) * Math.cos(2 * deg2rad(geomMeanLongSun))
    - 0.5 * varY * varY * Math.sin(4 * deg2rad(geomMeanLongSun))
    - 1.25 * eccentEarthOrbit * eccentEarthOrbit * Math.sin(2 * deg2rad(geomMeanAnomSun))
  );

  let cosHA = Math.cos(deg2rad(90.833)) / (Math.cos(deg2rad(lat)) * Math.cos(deg2rad(sunDeclin))) - Math.tan(deg2rad(lat)) * Math.tan(deg2rad(sunDeclin));
  const polar = cosHA > 1 ? "never-rises" : cosHA < -1 ? "never-sets" : null;
  cosHA = Math.max(-1, Math.min(1, cosHA));
  const hourAngle = rad2deg(Math.acos(cosHA));

  const solarNoonUTCMinutes = 720 - 4 * lon - eqOfTime;
  const sunriseUTCMinutes = solarNoonUTCMinutes - hourAngle * 4;
  const sunsetUTCMinutes = solarNoonUTCMinutes + hourAngle * 4;

  const minutesToDate = (baseDate, m) => {
    const dayStart = Date.UTC(baseDate.getUTCFullYear(), baseDate.getUTCMonth(), baseDate.getUTCDate());
    return new Date(dayStart + m * 60000);
  };
  const solarNoon = minutesToDate(date, solarNoonUTCMinutes);
  return {
    sunrise: polar ? null : minutesToDate(date, sunriseUTCMinutes),
    sunset: polar ? null : minutesToDate(date, sunsetUTCMinutes),
    solarNoon,
    solarMidnight: new Date(solarNoon.getTime() + 12 * 60 * 60 * 1000),
    polar
  };
}

// Meeus low-precision lunar position (Astronomical Algorithms ch.
// 47, main periodic terms only -- a few arcminutes accuracy, ample
// for rise/set to within a few minutes).
function moonEclipticPosition(date) {
  const JD = julianDay(date);
  const T = (JD - 2451545.0) / 36525;
  const Lp = 218.3164477 + 481267.88123421 * T;
  const D = 297.8501921 + 445267.1114034 * T;
  const M = 357.5291092 + 35999.0502909 * T;
  const Mp = 134.9633964 + 477198.8675055 * T;
  const F = 93.2720950 + 483202.0175233 * T;
  const sinDeg = (x) => Math.sin(deg2rad(((x % 360) + 360) % 360));

  const lon = Lp + 6.289 * sinDeg(Mp) + 1.274 * sinDeg(2 * D - Mp) + 0.658 * sinDeg(2 * D)
    + 0.214 * sinDeg(2 * Mp) - 0.186 * sinDeg(M) - 0.114 * sinDeg(2 * F);
  const lat = 5.128 * sinDeg(F) + 0.281 * sinDeg(Mp + F) + 0.278 * sinDeg(Mp - F) + 0.173 * sinDeg(2 * D - F);
  return { lon: ((lon % 360) + 360) % 360, lat };
}

function eclipticToEquatorial(lon, lat, date) {
  const JD = julianDay(date);
  const T = (JD - 2451545.0) / 36525;
  const obliquity = 23.439291 - 0.0130042 * T;
  const lonR = deg2rad(lon), latR = deg2rad(lat), oblR = deg2rad(obliquity);
  const ra = rad2deg(Math.atan2(
    Math.sin(lonR) * Math.cos(oblR) - Math.tan(latR) * Math.sin(oblR),
    Math.cos(lonR)
  ));
  const dec = rad2deg(Math.asin(
    Math.sin(latR) * Math.cos(oblR) + Math.cos(latR) * Math.sin(oblR) * Math.sin(lonR)
  ));
  return { ra: (ra + 360) % 360, dec };
}

function greenwichSiderealTime(date) {
  const JD = julianDay(date);
  const T = (JD - 2451545.0) / 36525;
  const GST = 280.46061837 + 360.98564736629 * (JD - 2451545.0) + 0.000387933 * T * T - T * T * T / 38710000;
  return ((GST % 360) + 360) % 360;
}

function moonAltitudeAt(date, lat, lon) {
  const pos = moonEclipticPosition(date);
  const eq = eclipticToEquatorial(pos.lon, pos.lat, date);
  const GST = greenwichSiderealTime(date);
  const LST = (GST + lon + 360) % 360;
  let HA = LST - eq.ra;
  HA = ((HA + 180) % 360 + 360) % 360 - 180;
  const HAr = deg2rad(HA), decR = deg2rad(eq.dec), latR = deg2rad(lat);
  return rad2deg(Math.asin(Math.sin(decR) * Math.sin(latR) + Math.cos(decR) * Math.cos(latR) * Math.cos(HAr)));
}

// Moonrise/set via sampling + linear interpolation across the
// horizon crossing. h0 = 0.125 deg is the standard approximate
// target altitude for the Moon (accounts for parallax outweighing
// refraction + semidiameter, unlike the Sun).
function findMoonRiseSet(date, lat, lon) {
  const h0 = 0.125;
  const dayStart = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
  let prevAlt = moonAltitudeAt(dayStart, lat, lon) - h0;
  let rise = null, set = null;
  for (let m = 10; m <= 1440; m += 10) {
    const t = new Date(dayStart.getTime() + m * 60000);
    const alt = moonAltitudeAt(t, lat, lon) - h0;
    if (prevAlt < 0 && alt >= 0 && !rise) {
      const frac = -prevAlt / (alt - prevAlt);
      rise = new Date(dayStart.getTime() + (m - 10 + 10 * frac) * 60000);
    }
    if (prevAlt >= 0 && alt < 0 && !set) {
      const frac = prevAlt / (prevAlt - alt);
      set = new Date(dayStart.getTime() + (m - 10 + 10 * frac) * 60000);
    }
    prevAlt = alt;
  }
  return { moonrise: rise, moonset: set };
}

// Cached per calendar day + coordinates -- moonrise/moonset needs a
// 144-sample search, too expensive to redo on every tick, especially
// during time-warp catch-up replay.
let astronomicalCache = { dateKey: null, lat: null, lon: null };

function getAstronomicalTimesForDay(date, lat, lon) {
  const dateKey = `${date.getUTCFullYear()}-${date.getUTCMonth()}-${date.getUTCDate()}`;
  if (astronomicalCache.dateKey === dateKey && astronomicalCache.lat === lat && astronomicalCache.lon === lon) {
    return astronomicalCache;
  }
  const solar = solarSunriseSunset(date, lat, lon);
  const { moonrise, moonset } = findMoonRiseSet(date, lat, lon);
  astronomicalCache = {
    dateKey, lat, lon,
    sunrise: solar.sunrise, sunset: solar.sunset,
    solarNoon: solar.solarNoon, solarMidnight: solar.solarMidnight,
    moonrise, moonset
  };
  return astronomicalCache;
}
