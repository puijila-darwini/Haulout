// null (polar day/night at extreme latitudes -- see isLocationIcy's
// neighbor isMatchingTime, which tolerates the same nulls).
function isDaytime(currentEnv) {
  if (currentEnv.sunrise && currentEnv.sunset) {
    const t = currentEnv.time.getTime();
    return t >= currentEnv.sunrise.getTime() && t < currentEnv.sunset.getTime();
  }
  const hour = currentEnv.time.getHours();
  return hour >= CONFIG.dayStartHour && hour < CONFIG.dayEndHour;
}

// Background state: tide, moon, sun, iciness -- the frame every
// placement below is read inside of. Global (not per-seal), shown
// once at the top of the Readings panel. Tide/moon/sun are each a
// single global fact; iciness is per-location, so it's a list.
function composeBackgroundState(currentEnv) {
  const tide = `${isHighTide(currentEnv.time) ? "High" : "Low"} ${isSpringTide(currentEnv.time) ? "Spring" : "Neap"} Tide`;
  const moon = `${lunarPhase(currentEnv.time)}, in ${currentEnv.lunarPosition.sign} ${currentEnv.lunarPosition.degree}\u00b0`;
  const sun = `${isDaytime(currentEnv) ? "Day" : "Night"}, Sun in ${currentEnv.solarPosition.sign} ${currentEnv.solarPosition.degree}\u00b0`;
  const icyLocations = LOCATIONS.filter(loc => isLocationIcy(loc.name, currentEnv.time)).map(loc => loc.name);
  const icy = icyLocations.length ? `Icy: ${icyLocations.join(", ")}` : "No locations icy";
  return { tide, moon, sun, icy };
}

// Mechanical delineation for one presence -- the literal,
// un-compressed technical read. Tier 1 (Identity: Species/House,
// Temperament, Mode/Age -- fixed, no context needed) and tier 2
// (Standing: Clan dignity/"Placement", Chronotype -- solo, from
// resolveHappiness). "Meeting" (tier 3, internally still named
// Aspect) is deliberately NOT here -- it's pairwise, not a
// property of one seal, and reads far more clearly as its own table
// (see composeAspectTable) than folded into a run-on sentence per
// seal. Company (the relational maxims themselves) is likewise kept
// separate (see composeCompanyClauses) for the same reason -- each
// factor is really about a specific other seal, not a solo fact
// about this one. Background state is separate too
// (composeBackgroundState), since it's global, not per-seal. Reuses
// presence.happiness rather than recomputing it, since it's already
// resolved once at trigger time.
function composeDelineation(presence) {
  const seal = presence.seal;
  const sig = SPECIES_SIGNIFICATION[seal.species];

  const dignityFactor = presence.happiness.factors.find(f => f.label === "Home Ground" || f.label === "Hostile Ground" || f.label === "Neutral Ground");
  const sectFactor = presence.happiness.factors.find(f => f.label === "In Rhythm" || f.label === "Out of Rhythm");

  return {
    domain: `About ${describeSpeciesSignification(sig)}.`,
    temperament: `${TEMPERAMENT_SIGNIFICATION[seal.temperament]}.`,
    mode: `${MODE_SIGNIFICATION[seal.mode]}.`,
    dignity: dignityFactor ? `${dignityFactor.label} at ${presence.location}.` : null,
    sect: sectFactor ? `${sectFactor.label}.` : null
  };
}

// Company: the relational maxims themselves (Rival Clan, Courtship,
// Overcrowded, etc.) -- distinct from Aspect, which is the geometric
// angle between two placements; Company is *why* a meeting has the
// character it does. One clause per factor, attributed to whichever
// other seal it came from where the rule is pairwise; solo factors
// (Juvenile Alone, Overcrowded) have no "against" and stand alone.
function composeCompanyClauses(presence) {
  const factors = (presence.company && presence.company.factors) || [];
  if (factors.length === 0) return ["Alone -- no other seal present to keep company with."];
  return factors.map(f => f.against ? `${f.label} with ${formatSealName(f.against)} (#${f.against.number}).` : `${f.label}.`);
}

// Color for a Meeting type -- shared by the wheel chart and the
// Meetings table, one source instead of two copies.
function meetingColor(aspect) {
  return aspect === "Tense" ? "#a8695c" : aspect === "Apart" ? "#8b7a95" : aspect === "Friendly" ? "#4d7d68" : "var(--text-muted)";
}

// Every unique pair of currently-present seals and the aspect
// between them -- one row per pair, not per seal (so a 4-seal scene
// is 6 rows, not 4 sentences each repeating the same 3 facts back
// from a different angle).
function composeAspectTable(presences) {
  const rows = [];
  for (let i = 0; i < presences.length; i++) {
    for (let j = i + 1; j < presences.length; j++) {
      const a = presences[i], b = presences[j];
      rows.push({
        sealA: a.seal, locA: a.location,
        sealB: b.seal, locB: b.location,
        aspect: locationAspect(a.location, a.seal, b.location, b.seal)
      });
    }
  }
  return rows;
}

// Synthesis checklist -- a literal translation of Tracy Marks' chart-
// reading algorithm, as far as this system has a real equivalent for
// each item (several classical items -- angles, nodes, retrograde-
// count-as-planets -- don't have one and are left out rather than
// faked). Every row is computed live from data that already exists
// elsewhere; nothing new is tracked. "Notable" (the source material's
// "circle it") thresholds are adapted from the source's fixed ~14
// points to this system's variable, usually much smaller, count of
// currently-present seals.
// Occupancy Pattern -- the real "planetary pattern" concept
// (Bundle/Bowl/Splash/etc.), adapted to this system's 8 fixed
// points and given names that fit a coastline instead of a chart.
// Classified from the largest empty gap between occupied wheel
// positions, same underlying method real chart software uses
// (sort positions, find gaps, read the shape from them).
function classifyOccupancyPattern(presences) {
  const occupiedLocations = [...new Set(presences.map(p => p.location))];
  if (occupiedLocations.length < 2) {
    return { pattern: "N/A", detail: occupiedLocations.length === 0 ? "No seals present." : "Only one location occupied." };
  }
  const angles = occupiedLocations.map(loc => WHEEL_ANGLES[loc]).sort((a, b) => a - b);
  const gaps = angles.map((a, i) => {
    const next = angles[(i + 1) % angles.length];
    return ((next - a + 360) % 360) || 360;
  });
  const sortedGaps = [...gaps].sort((a, b) => b - a);
  const maxGap = sortedGaps[0], secondGap = sortedGaps[1] || 0;
  const occupiedSpan = 360 - maxGap;

  if (occupiedSpan <= 135) return { pattern: "Huddle", detail: `All occupied locations within a ${occupiedSpan}\u00b0 span.` };
  if (maxGap < 60) return { pattern: "Scatter", detail: `Spread widely -- largest empty stretch only ${maxGap}\u00b0.` };
  if (secondGap >= 60 && Math.abs(maxGap - secondGap) < 45) return { pattern: "Split", detail: `Two comparable empty stretches (${maxGap}\u00b0 and ${secondGap}\u00b0) divide the occupied locations into two clusters.` };
  if (occupiedSpan <= 202) return { pattern: "Bay", detail: `All occupied locations within a ${occupiedSpan}\u00b0 span.` };
  return { pattern: "Procession", detail: `Occupies about ${occupiedSpan}\u00b0, one clear empty stretch of ${maxGap}\u00b0.` };
}

// Configurations -- Grand Trine and T-Square equivalents, translated
// by relationship-type pattern among 3 seals rather than by degree.
// Raft: three seals all mutually Friendly -- real pinniped
// terminology for a group resting together, which is exactly what a
// Grand Trine's all-harmonious triangle represents.
// Crosscurrent: two seals Apart, a third Tense to both -- caught
// between the two shores, the real shape a T-Square has. Note: under
// the current strictly-binary chronotype rule this can't actually
// occur (Tense is the exact complement of a two-value split, so
// nothing can be Tense to two things already Tense to each other) --
// left in as-is rather than removed, since that's a property of the
// current mechanics, not a fixed limit.
function detectConfigurations(presences) {
  const configs = [];
  const aspectBetween = {};
  composeAspectTable(presences).forEach(r => {
    aspectBetween[[r.sealA.number, r.sealB.number].sort((a, b) => a - b).join("-")] = r.aspect;
  });
  const between = (a, b) => aspectBetween[[a, b].sort((x, y) => x - y).join("-")];
  const nums = presences.map(p => p.seal.number);

  for (let i = 0; i < nums.length; i++) {
    for (let j = i + 1; j < nums.length; j++) {
      for (let k = j + 1; k < nums.length; k++) {
        if (between(nums[i], nums[j]) === "Friendly" && between(nums[i], nums[k]) === "Friendly" && between(nums[j], nums[k]) === "Friendly") {
          configs.push({ type: "Raft", seals: [nums[i], nums[j], nums[k]] });
        }
      }
    }
  }
  for (let i = 0; i < nums.length; i++) {
    for (let j = i + 1; j < nums.length; j++) {
      if (between(nums[i], nums[j]) !== "Apart") continue;
      for (let k = 0; k < nums.length; k++) {
        if (k === i || k === j) continue;
        if (between(nums[i], nums[k]) === "Tense" && between(nums[j], nums[k]) === "Tense") {
          configs.push({ type: "Crosscurrent", seals: [nums[i], nums[j], nums[k]] });
        }
      }
    }
  }
  return configs;
}

// Stationary equivalent -- locations whose icy state will flip
// within the next real day. Shores and Iceberg never change, so
// they're excluded rather than always reporting "no."
function stationaryLocations(time) {
  return LOCATIONS.filter(loc => loc.category !== "Shore" && loc.name !== "Iceberg").map(loc => {
    const now = isLocationIcy(loc.name, time);
    const soon = isLocationIcy(loc.name, new Date(time.getTime() + DAY));
    return now !== soon ? { name: loc.name, turning: now ? "about to thaw" : "about to ice over" } : null;
  }).filter(Boolean);
}

// Meeting/Company Divergence -- Haulout-native, not an astrology
// translation. Company factors only ever exist between co-located
// seals (recomputeCompany groups presences by location), so this
// asks: among seals that are Together, does the relational read
// (Company) actually agree with simple proximity, or is a pair
// sharing a spot while their Company factors are net negative
// (Rival Clan grating on Courtship, etc.)?
function detectDivergence(presences) {
  const results = [];
  const byLocation = {};
  presences.forEach(p => { (byLocation[p.location] = byLocation[p.location] || []).push(p); });
  Object.values(byLocation).forEach(group => {
    for (let i = 0; i < group.length; i++) {
      for (let j = i + 1; j < group.length; j++) {
        const a = group[i], b = group[j];
        const factorsAB = (a.company?.factors || []).filter(f => f.against && f.against.number === b.seal.number);
        const sign = factorsAB.reduce((sum, f) => sum + f.points, 0);
        if (sign < 0) results.push({ sealA: a.seal, sealB: b.seal, labels: factorsAB.map(f => f.label) });
      }
    }
  });
  return results;
}

// Emergence Category Balance -- Solar/Lunar/Morning/Stochastic split
// among what's currently active, same tally shape as Element but
// answering why each seal showed up rather than what it is.
function categoryBalance(activeEmergences) {
  const counts = { SOLAR: 0, LUNAR: 0, MORNING: 0, STOCHASTIC: 0 };
  activeEmergences.forEach(e => { counts[TYPE_TO_CATEGORY[e.type] || "STOCHASTIC"]++; });
  return counts;
}

// Behavioural Harmony -- how many present seals are doing the lunar-
// phase-favored behaviour (BEHAVIOUR_BY_PHASE already computes this
// internally for the bias weighting; never surfaced anywhere until now).
function behaviouralHarmony(presences, time) {
  const matched = BEHAVIOUR_BY_PHASE[lunarPhase(time)];
  const harmonious = presences.filter(p => p.behaviour && p.behaviour.type === matched);
  return { matched, harmonious };
}

// Dynamism -- the spread between the longest-running and most-
// recently-arrived active emergence. A wide spread means a mixed
// scene of old-timers and brand-new arrivals; a narrow one means
// everything currently present started around the same moment.
function measureDynamism(activeEmergences, time) {
  if (activeEmergences.length === 0) return null;
  const sorted = [...activeEmergences].sort((a, b) => new Date(a.created) - new Date(b.created));
  const oldest = sorted[0], newest = sorted[sorted.length - 1];
  const spread = new Date(newest.created).getTime() - new Date(oldest.created).getTime();
  return { oldest, newest, spread, oldestAge: time.getTime() - new Date(oldest.created).getTime(), newestAge: time.getTime() - new Date(newest.created).getTime() };
}

// Mutual reception -- every pair of present seals of different clans
// where each is sitting at the other's Home Ground.
function detectMutualReception(presences) {
  const results = [];
  for (let i = 0; i < presences.length; i++) {
    for (let j = i + 1; j < presences.length; j++) {
      const pi = presences[i], pj = presences[j];
      const diA = CLAN_DIGNITY[pi.seal.clan], diB = CLAN_DIGNITY[pj.seal.clan];
      if (pi.seal.clan !== pj.seal.clan && diA && diB && pi.location === diB.domicile && pj.location === diA.domicile) {
        results.push({ sealA: pi.seal, sealB: pj.seal });
      }
    }
  }
  return results;
}

// Session-only tracking (not persisted with state) of which
// Synthesis-notable facts are currently logged, so the journal
// records the ONSET of a notable condition once, not every poll
// while it persists. A reload may re-log an already-ongoing
// condition once -- an acceptable minor redundancy against the
// complexity of extending the save schema just for this.
let loggedSynthesisFacts = new Set();

// Wires Synthesis's notable moments into the Journal -- reuses the
// exact same detectors composeSynthesis draws from (detectConfigurations,
// detectMutualReception, measureDynamism), so nothing about what
// counts as "notable" is duplicated or can drift out of sync with
// what the Synthesis screen itself shows.
function logNotableSynthesis(state, currentEnv) {
  const presences = state.world.presences || [];
  const activeEmergences = state.world.activeEmergences || [];
  const currentFacts = new Set();

  detectConfigurations(presences).filter(c => c.type === "Raft").forEach(c => {
    const key = "raft:" + [...c.seals].sort((a, b) => a - b).join(",");
    currentFacts.add(key);
    if (!loggedSynthesisFacts.has(key)) {
      const names = c.seals.map(n => formatSealName(presences.find(p => p.seal.number === n).seal)).join(", ");
      appendJournal(state, currentEnv.time, "Raft Formed", `${names} settled into a Raft -- all mutually Friendly.`, "SYNTHESIS");
    }
  });

  detectMutualReception(presences).forEach(r => {
    const key = "reception:" + [r.sealA.number, r.sealB.number].sort((a, b) => a - b).join(",");
    currentFacts.add(key);
    if (!loggedSynthesisFacts.has(key)) {
      appendJournal(state, currentEnv.time, "Mutual Reception", `${formatSealName(r.sealA)} and ${formatSealName(r.sealB)} each stand on the other's Home Ground.`, "SYNTHESIS");
    }
  });

  const dynamism = measureDynamism(activeEmergences, currentEnv.time);
  if (dynamism && dynamism.spread > 3 * 60 * 60 * 1000) {
    const key = "dynamism-spike";
    currentFacts.add(key);
    if (!loggedSynthesisFacts.has(key)) {
      appendJournal(state, currentEnv.time, "Dynamism Spike", `A spread of ${formatMsToReadable(dynamism.spread)} between the longest-running and newest arrivals.`, "SYNTHESIS");
    }
  }

  loggedSynthesisFacts = currentFacts;
}

function composeSynthesis(currentState, currentEnv) {
  const presences = currentState.world.presences || [];
  const activeEmergences = currentState.world.activeEmergences || [];
  const n = presences.length;
  const rows = [];

  // Predominant / weakest Temperament.
  const temperamentCounts = { Sanguine: 0, Choleric: 0, Melancholic: 0, Phlegmatic: 0 };
  presences.forEach(p => { temperamentCounts[p.seal.temperament]++; });
  const temperamentEntries = Object.entries(temperamentCounts);
  const topTemperament = temperamentEntries.reduce((a, b) => (b[1] > a[1] ? b : a));
  rows.push({
    item: "Predominant Temperament",
    finding: n > 0 ? `${topTemperament[0]} (${topTemperament[1]} of ${n})` : "No seals present",
    notable: n >= 2 && topTemperament[1] > n / 2
  });
  const missingTemperaments = temperamentEntries.filter(([, c]) => c === 0).map(([k]) => k);
  rows.push({
    item: "Weakest Temperament",
    finding: n === 0 ? "No seals present" : missingTemperaments.length ? `Absent: ${missingTemperaments.join(", ")}` : "All represented",
    notable: n > 0 && missingTemperaments.length > 0
  });

  // Icy locations -- this system's retrograde-planet-count equivalent.
  const icyCount = LOCATIONS.filter(loc => isLocationIcy(loc.name, currentEnv.time)).length;
  rows.push({
    item: "Icy Locations",
    finding: `${icyCount} of ${LOCATIONS.length}`,
    notable: icyCount === 0 || icyCount > 3
  });

  // Seals at Home Ground -- "planet in own sign/house."
  const atHome = presences.filter(p => (p.happiness?.factors || []).some(f => f.label === "Home Ground"));
  rows.push({
    item: "Seals at Home Ground",
    finding: atHome.length ? atHome.map(p => formatSealName(p.seal)).join(", ") : "None",
    notable: atHome.length > 0
  });

  // Most aspected / unaspected seals.
  const meetingRows = composeAspectTable(presences).filter(r => r.aspect !== "Together");
  const meetingCounts = {};
  presences.forEach(p => { meetingCounts[p.seal.number] = 0; });
  meetingRows.forEach(r => { meetingCounts[r.sealA.number]++; meetingCounts[r.sealB.number]++; });
  let mostAspected = null;
  Object.entries(meetingCounts).forEach(([num, c]) => { if (!mostAspected || c > mostAspected.count) mostAspected = { num: Number(num), count: c }; });
  rows.push({
    item: "Most Aspected Seal",
    finding: mostAspected && mostAspected.count > 0
      ? `${formatSealName(presences.find(p => p.seal.number === mostAspected.num).seal)} -- ${mostAspected.count} meeting(s)`
      : "None",
    notable: !!mostAspected && mostAspected.count >= 2
  });
  const unaspected = presences.filter(p => meetingCounts[p.seal.number] === 0);
  rows.push({
    item: "Unaspected Seals",
    finding: n <= 1 ? "N/A (fewer than 2 present)" : unaspected.length ? unaspected.map(p => formatSealName(p.seal)).join(", ") : "None",
    notable: n > 1 && unaspected.length > 0
  });

  // Predominant / absent Meeting type.
  const typeCounts = { Together: 0, Friendly: 0, Tense: 0, Apart: 0 };
  composeAspectTable(presences).forEach(r => { typeCounts[r.aspect]++; });
  const totalPairs = Object.values(typeCounts).reduce((a, b) => a + b, 0);
  const topType = Object.entries(typeCounts).reduce((a, b) => (b[1] > a[1] ? b : a));
  rows.push({
    item: "Predominant Meeting Type",
    finding: totalPairs > 0 ? `${topType[0]} (${topType[1]} of ${totalPairs})` : "No pairs",
    notable: totalPairs > 0 && topType[1] > totalPairs / 2
  });
  const absentTypes = Object.entries(typeCounts).filter(([, c]) => c === 0).map(([k]) => k);
  rows.push({
    item: "Absent Meeting Type",
    finding: totalPairs === 0 ? "No pairs" : absentTypes.length ? absentTypes.join(", ") : "All types present",
    notable: totalPairs > 0 && absentTypes.length > 0
  });

  // Sun/Moon (Solar/Lunar seal) & relationship.
  const solarSeal = currentState.currentSolarSeal, lunarSeal = currentState.currentLunarSeal;
  let sunMoonFinding = "Not yet resolved today.";
  let sunMoonNotable = false;
  if (solarSeal && lunarSeal) {
    const solarPresence = presences.find(p => p.seal.number === solarSeal.number);
    const lunarPresence = presences.find(p => p.seal.number === lunarSeal.number);
    if (solarPresence && lunarPresence) {
      const aspect = locationAspect(solarPresence.location, solarPresence.seal, lunarPresence.location, lunarPresence.seal);
      sunMoonFinding = `${formatSealName(solarSeal)} & ${formatSealName(lunarSeal)}: ${aspect}`;
      sunMoonNotable = true;
    } else {
      sunMoonFinding = `${formatSealName(solarSeal)} (Sun) & ${formatSealName(lunarSeal)} (Moon) -- not concurrently present`;
    }
  }
  rows.push({ item: "Sun/Moon Seals & Relationship", finding: sunMoonFinding, notable: sunMoonNotable });

  // Mutual reception -- two present seals of different clans, each
  // sitting at the other's Home Ground.
  const mutualReceptions = detectMutualReception(presences);
  rows.push({
    item: "Mutual Reception",
    finding: mutualReceptions.length ? mutualReceptions.map(r => `${formatSealName(r.sealA)} & ${formatSealName(r.sealB)}`).join("; ") : "None found",
    notable: mutualReceptions.length > 0
  });

  // Strongest Meeting -- highest-intensity pairing currently active.
  let strongest = null;
  meetingRows.forEach(r => {
    const wa = sealLineIntensity(activeEmergences, r.sealA.number);
    const wb = sealLineIntensity(activeEmergences, r.sealB.number);
    const weight = (wa.weight + wb.weight) / 2;
    if (!strongest || weight > strongest.weight) strongest = { r, weight };
  });
  rows.push({
    item: "Strongest Meeting",
    finding: strongest ? `${formatSealName(strongest.r.sealA)} \u2194 ${formatSealName(strongest.r.sealB)}: ${strongest.r.aspect} (${strongest.weight.toFixed(1)})` : "No meetings",
    notable: !!strongest && strongest.weight >= 3
  });

  // Occupancy Pattern.
  const patternResult = classifyOccupancyPattern(presences);
  rows.push({
    item: "Occupancy Pattern",
    finding: patternResult.pattern === "N/A" ? patternResult.detail : `${patternResult.pattern} -- ${patternResult.detail}`,
    notable: patternResult.pattern === "Huddle" || patternResult.pattern === "Split"
  });

  // Configurations (Raft/Crosscurrent).
  const configs = detectConfigurations(presences);
  rows.push({
    item: "Configurations",
    finding: configs.length
      ? configs.map(c => `${c.type} (${c.seals.map(n => formatSealName(presences.find(p => p.seal.number === n).seal)).join(", ")})`).join("; ")
      : "None found",
    notable: configs.length > 0
  });

  // Locations about to turn (stationary equivalent).
  const turning = stationaryLocations(currentEnv.time);
  rows.push({
    item: "Locations About to Turn",
    finding: turning.length ? turning.map(t => `${t.name} (${t.turning})`).join(", ") : "None within a day",
    notable: turning.length > 0
  });

  // Meeting/Company Divergence.
  const divergent = detectDivergence(presences);
  rows.push({
    item: "Meeting/Company Divergence",
    finding: divergent.length
      ? divergent.map(d => `${formatSealName(d.sealA)} & ${formatSealName(d.sealB)} together, but ${d.labels.join(", ")}`).join("; ")
      : "None found",
    notable: divergent.length > 0
  });

  // Emergence Category Balance.
  const catCounts = categoryBalance(activeEmergences);
  const catTotal = Object.values(catCounts).reduce((a, b) => a + b, 0);
  const topCat = Object.entries(catCounts).reduce((a, b) => (b[1] > a[1] ? b : a));
  rows.push({
    item: "Emergence Category Balance",
    finding: catTotal > 0 ? Object.entries(catCounts).map(([k, v]) => `${k} ${v}`).join(", ") : "No active emergences",
    notable: catTotal > 0 && topCat[1] > catTotal / 2
  });

  // Behavioural Harmony.
  const harmony = behaviouralHarmony(presences, currentEnv.time);
  rows.push({
    item: "Behavioural Harmony",
    finding: n > 0 ? `${harmony.harmonious.length} of ${n} doing ${harmony.matched} (today's favored behaviour)` : "No seals present",
    notable: n > 0 && harmony.harmonious.length / n > 0.5
  });

  // Dynamism -- longest-running vs newest arrival.
  const dynamism = measureDynamism(activeEmergences, currentEnv.time);
  rows.push({
    item: "Dynamism",
    finding: dynamism
      ? `Longest-running: started ${formatMsToReadable(dynamism.oldestAge)} ago. Newest: started ${formatMsToReadable(dynamism.newestAge)} ago. Spread: ${formatMsToReadable(dynamism.spread)}.`
      : "No active emergences",
    notable: !!dynamism && dynamism.spread > 3 * 60 * 60 * 1000
  });

  // Group into sections mirroring Tracy Marks' A/B/C structure, named
  // for what they actually are here rather than the astrology terms.
  // No section D: the source's "Preliminary Synthesis" was the
  // point-tallied Strongest Planets/Signs/Houses ranking, already
  // flagged as a dodge and deliberately left unbuilt.
  const SECTION_MEMBERSHIP = {
    "A: The Scene as a Whole": [
      "Predominant Temperament", "Weakest Temperament", "Icy Locations",
      "Occupancy Pattern", "Emergence Category Balance", "Behavioural Harmony",
      "Sun/Moon Seals & Relationship", "Dynamism"
    ],
    "B: Individual Standing": [
      "Seals at Home Ground", "Most Aspected Seal", "Unaspected Seals", "Locations About to Turn"
    ],
    "C: Meetings & Relationships": [
      "Predominant Meeting Type", "Absent Meeting Type", "Strongest Meeting",
      "Configurations", "Mutual Reception", "Meeting/Company Divergence"
    ]
  };
  return Object.entries(SECTION_MEMBERSHIP).map(([title, items]) => ({
    title,
    rows: items.map(item => rows.find(r => r.item === item)).filter(Boolean)
  }));
}

function renderSynthesisTable(sections) {
  return sections.map(section => `
    <h5 style="margin:10px 0 3px 0; font-size:12px; color:var(--text-muted); letter-spacing:0.03em;">${section.title}</h5>
    <table style="width:100%; border-collapse:collapse; font-size:12px; margin-bottom:4px;">
      <tbody>
        ${section.rows.map(r => `
          <tr style="border-bottom:1px solid var(--border-color); opacity:${r.notable ? "1" : "0.45"};">
            <td style="padding:3px 4px; white-space:nowrap;${r.notable ? " font-weight:bold; color:var(--accent);" : ""}">${r.item}</td>
            <td style="padding:3px 4px;">${r.finding}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `).join("");
}


// Fixed wheel position for each location, degrees clockwise from
// top. Iceberg and Sandy Shoal -- the two locations belonging
// to neither shore -- sit on the horizontal diameter. Broad Rock
// and Rugged Rock, both Day chronotype (Near Shore's own two
// rocks), sit at true top and bottom -- the requirement that top and
// bottom share a chronotype. Two properties fall out of this rather
// than being separately chosen: Near Shore and Far Shore still land
// directly opposite each other (on the other diagonal), and Gentle
// Pebble/The Needle -- both Night chronotype, Far Shore's own two
// rocks -- end up opposite each other too, mirroring the Boulder
// pair.
const WHEEL_ANGLES = {
  "Broad Rock": 0, "Near Shore": 45, "Iceberg": 90, "Hollow Pebble": 135,
  "Rugged Rock": 180, "Far Shore": 225, "Sandy Shoal": 270, "The Needle": 315
};

function wheelPoint(locationName, radius, cx, cy) {
  const rad = (WHEEL_ANGLES[locationName] * Math.PI) / 180;
  return { x: cx + radius * Math.sin(rad), y: cy - radius * Math.cos(rad) };
}

// The chart: a real picture of who's where and how they relate,
// built on the same fixed geography as the horizon-hero (just laid
// out as a circle here instead of a coastline) rather than a
// separate, disconnected visualization. Together (same location)
// draws no line -- two markers sharing a point already shows it.
// Marker shape per Temperament, inspired by the classical elemental
// glyphs (Fire/Air/Water/Earth) rather than invented from scratch --
// the same Choleric/Sanguine/Phlegmatic/Melancholic correspondence
// TEMPERAMENT_QUALITY's Hot/Cold split is already drawn from.
// Fire (Choleric): plain up triangle. Air (Sanguine): up triangle
// with a bar. Water (Phlegmatic): plain down triangle. Earth
// (Melancholic): down triangle with a bar.
const TEMPERAMENT_SHAPE = { Choleric: "fire", Sanguine: "air", Phlegmatic: "water", Melancholic: "earth" };

// Marker color per Age -- palest for Juvenile, green for Adult,
// greyest for Elder.
const AGE_COLOR = { Juvenile: "#cfe3d8", Adult: "#3f6b58", Elder: "#7d8c88" };

function sealMarkerSVG(x, y, seal) {
  const r = 6.5;
  const shape = TEMPERAMENT_SHAPE[seal.temperament];
  const color = AGE_COLOR[seal.mode];
  const up = `${x.toFixed(1)},${(y - r).toFixed(1)} ${(x - r * 0.87).toFixed(1)},${(y + r * 0.5).toFixed(1)} ${(x + r * 0.87).toFixed(1)},${(y + r * 0.5).toFixed(1)}`;
  const down = `${x.toFixed(1)},${(y + r).toFixed(1)} ${(x - r * 0.87).toFixed(1)},${(y - r * 0.5).toFixed(1)} ${(x + r * 0.87).toFixed(1)},${(y - r * 0.5).toFixed(1)}`;
  const bar = `<line x1="${(x - r * 0.55).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + r * 0.55).toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--text-main)" stroke-width="1.2"/>`;
  const points = (shape === "fire" || shape === "air") ? up : down;
  const barMarkup = (shape === "air" || shape === "earth") ? bar : "";
  return `<polygon points="${points}" fill="${color}" stroke="var(--text-main)" stroke-width="1"/>${barMarkup}`;
}

// Standalone Temperament/Age glyph for use outside the wheel chart
// (the Home cards) -- same shape/color as the chart markers, just
// wrapped in its own small fixed-size SVG rather than placed at wheel
// coordinates.
function sealGlyphIcon(seal) {
  return `<svg width="16" height="16" viewBox="0 0 16 16" style="display:block;">${sealMarkerSVG(8, 8, seal)}</svg>`;
}

// Line weight and applying/separating for a seal's current
// emergence(s), for the chart -- thickest at Peak, thick while
// Active, thin while Fading. A seal with several concurrent
// emergences is represented by its most intense one. Fading counts
// as separating (dashed); everything else (still building or fully
// underway) counts as applying (solid) -- the real classical
// applying/separating distinction, translated from "is the aspect
// getting closer to exact" into "is this emergence getting closer
// to ending."
const LIFECYCLE_WEIGHT = { Active: 2.5, Peak: 3.5, Fading: 1 };

function sealLineIntensity(activeEmergences, sealNumber) {
  const mine = activeEmergences.filter(e => e.sealNumber === sealNumber);
  if (mine.length === 0) return { weight: 1.5, fading: false };
  let weight = 1;
  let fading = false;
  mine.forEach(e => {
    weight = Math.max(weight, LIFECYCLE_WEIGHT[e.lifecycleState] || 1.5);
    if (e.lifecycleState === "Fading") fading = true;
  });
  return { weight, fading };
}

// Chart display preferences -- view-only settings, not game state,
// so not persisted with the world. simplifyLines collapses duplicate
// lines when several seals share a location (which otherwise
// produces one line per SEAL pair, even though most of those lines
// are the same location-to-location aspect repeated).
let chartSettings = { simplifyLines: false, showIceTideMarkers: true, lineThickness: 1, showLabels: true };

function shapeSwatchSVG(shape, fillColor) {
  const r = 6, cx = 8, cy = 8;
  const up = `${cx},${(cy - r).toFixed(1)} ${(cx - r * 0.87).toFixed(1)},${(cy + r * 0.5).toFixed(1)} ${(cx + r * 0.87).toFixed(1)},${(cy + r * 0.5).toFixed(1)}`;
  const down = `${cx},${(cy + r).toFixed(1)} ${(cx - r * 0.87).toFixed(1)},${(cy - r * 0.5).toFixed(1)} ${(cx + r * 0.87).toFixed(1)},${(cy - r * 0.5).toFixed(1)}`;
  const bar = `<line x1="${(cx - r * 0.55).toFixed(1)}" y1="${cy}" x2="${(cx + r * 0.55).toFixed(1)}" y2="${cy}" stroke="var(--text-main)" stroke-width="1.2"/>`;
  const points = (shape === "fire" || shape === "air") ? up : down;
  const barMarkup = (shape === "air" || shape === "earth") ? bar : "";
  return `<svg width="14" height="14" viewBox="0 0 16 16" style="vertical-align:middle; margin-right:5px;"><polygon points="${points}" fill="${fillColor}" stroke="var(--text-main)" stroke-width="1"/>${barMarkup}</svg>`;
}

function colorSwatchSVG(color) {
  return `<svg width="14" height="14" viewBox="0 0 16 16" style="vertical-align:middle; margin-right:5px;"><circle cx="8" cy="8" r="6" fill="${color}" stroke="var(--text-main)" stroke-width="1"/></svg>`;
}

function renderChart(presences, activeEmergences, time) {
  const cx = 150, cy = 150, ringR = 110, labelR = 132, sealR = 82;

  const byLocation = {};
  presences.forEach(p => {
    if (!byLocation[p.location]) byLocation[p.location] = [];
    byLocation[p.location].push(p);
  });

  const locationMarkup = Object.keys(WHEEL_ANGLES).map(loc => {
    const pt = wheelPoint(loc, ringR, cx, cy);
    const labelPt = wheelPoint(loc, labelR, cx, cy);
    const locData = LOCATIONS.find(l => l.name === loc);
    const icy = time && isLocationIcy(loc, time);
    const submerged = time && locData.capacity !== Infinity && getEffectiveCapacity(loc, time) === 0;
    const dotFill = icy ? "#f2f8fa" : "var(--text-muted)";
    let markerMarkup = "";
    if (chartSettings.showIceTideMarkers && (icy || submerged)) {
      const markers = [icy ? "I" : null, submerged ? "T" : null].filter(Boolean).join("");
      const markerPt = wheelPoint(loc, ringR - 12, cx, cy);
      markerMarkup = `<text x="${markerPt.x.toFixed(1)}" y="${markerPt.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="8" font-weight="bold" fill="${icy ? '#7fb8cc' : 'var(--sea-top)'}">${markers}</text>`;
    }
    return `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3" fill="${dotFill}" stroke="var(--text-muted)" stroke-width="0.5"/>
      ${markerMarkup}
      ${chartSettings.showLabels ? `<text x="${labelPt.x.toFixed(1)}" y="${labelPt.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="var(--text-muted)">${loc}</text>` : ""}`;
  }).join("");

  const sealPositions = {};
  const sealMarkup = [];
  Object.entries(byLocation).forEach(([loc, group]) => {
    const basePt = wheelPoint(loc, sealR, cx, cy);
    group.forEach((p, i) => {
      // Multiple seals at one location stack vertically around the
      // anchor point rather than overlapping exactly.
      const y = basePt.y + (i - (group.length - 1) / 2) * 12;
      sealPositions[p.seal.number] = { x: basePt.x, y };
      sealMarkup.push(sealMarkerSVG(basePt.x, y, p.seal));
    });
  });

  const meetingRows = composeAspectTable(presences).filter(r => r.aspect !== "Together");
  let lineMarkup;
  if (chartSettings.simplifyLines) {
    // Collapse to one line per (location pair, aspect type), drawn
    // location-to-location rather than seal-to-seal -- weight is the
    // strongest of whatever got merged, dashed if any of them were
    // separating, so the merged line still shows the most urgent
    // thing true of that pairing rather than an arbitrary one.
    const merged = new Map();
    meetingRows.forEach(r => {
      const key = [r.locA, r.locB].sort().join("|") + "|" + r.aspect;
      const intensityA = sealLineIntensity(activeEmergences, r.sealA.number);
      const intensityB = sealLineIntensity(activeEmergences, r.sealB.number);
      const weight = (intensityA.weight + intensityB.weight) / 2;
      const dashed = intensityA.fading || intensityB.fading;
      const existing = merged.get(key);
      if (!existing || weight > existing.weight) {
        merged.set(key, { locA: r.locA, locB: r.locB, aspect: r.aspect, weight, dashed: dashed || (existing ? existing.dashed : false) });
      } else if (dashed) {
        existing.dashed = true;
      }
    });
    lineMarkup = [...merged.values()].map(m => {
      const a = wheelPoint(m.locA, sealR, cx, cy), b = wheelPoint(m.locB, sealR, cx, cy);
      return `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${meetingColor(m.aspect)}" stroke-width="${(m.weight * chartSettings.lineThickness).toFixed(1)}"${m.dashed ? ' stroke-dasharray="4,3"' : ""} opacity="0.85"/>`;
    }).join("");
  } else {
    lineMarkup = meetingRows.map(r => {
      const a = sealPositions[r.sealA.number], b = sealPositions[r.sealB.number];
      const intensityA = sealLineIntensity(activeEmergences, r.sealA.number);
      const intensityB = sealLineIntensity(activeEmergences, r.sealB.number);
      const weight = (intensityA.weight + intensityB.weight) / 2;
      const dashed = intensityA.fading || intensityB.fading;
      return `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${meetingColor(r.aspect)}" stroke-width="${(weight * chartSettings.lineThickness).toFixed(1)}"${dashed ? ' stroke-dasharray="4,3"' : ""} opacity="0.85"/>`;
    }).join("");
  }

  return `
    <svg viewBox="0 0 300 300" style="width:100%; max-width:280px; display:block; margin:0 auto;">
      <circle cx="${cx}" cy="${cy}" r="${ringR}" fill="none" stroke="var(--border-color)" stroke-width="1"/>
      ${lineMarkup}
      ${locationMarkup}
      ${sealMarkup.join("")}
    </svg>
  `;
}

// Positions the Sun and Moon glyphs along the horizon-hero's sky
// arc, from the same real astronomical data everything else uses
// (currentEnv.sunrise/sunset/moonrise/moonset). x sweeps left-to-
// right across the rise->set window; y arcs up from the horizon at
// rise/set to its highest point at the window's midpoint (solar/
// lunar noon isn't exactly that midpoint in reality, but it's a
// close enough visual approximation for this). Below the horizon
// (or when rise/set data isn't available, e.g. the no-geolocation
// placeholder branch) the glyph fades out rather than vanishing
// abruptly.
function positionOnArc(time, riseTime, setTime) {
  if (!riseTime || !setTime) return null;
  const rise = riseTime.getTime();
  let set = setTime.getTime();
  if (set <= rise) set += DAY; // window wraps past midnight (e.g. moonrise 22:00 / moonset 10:00)
  const t = time.getTime();
  for (const tc of [t, t + DAY, t - DAY]) {
    if (tc >= rise && tc <= set) {
      const frac = (tc - rise) / (set - rise);
      const x = 60 + frac * 880;
      const y = 108 - Math.sin(frac * Math.PI) * 80;
      return { visible: true, x, y };
    }
  }
  return { visible: false };
}

// Which shoreline shape represents which real LOCATION. Opacity is
// driven live from getEffectiveCapacity -- the same function the
// coast-viewport cards use -- so a rock here dims exactly when (and
// by exactly how much) it's actually tide-restricted: a Big Rock at
// ordinary high tide (capacity 3->1) dims partway, any rock reduced
// to 0 fades to near-invisible, and Shores/Iceberg (never
// tide-reduced) always render at full opacity. A floor keeps a
// "submerged" shape as a faint hint rather than vanishing outright.
const HORIZON_DECOR = [
  { name: "Near Shore", elementId: "deco-near-shore" },
  { name: "Broad Rock", elementId: "deco-big-smooth" },
  { name: "Rugged Rock", elementId: "deco-big-sharp" },
  { name: "Sandy Shoal", elementId: "deco-mixed" },
  { name: "Iceberg", elementId: "deco-iceberg" },
  { name: "Hollow Pebble", elementId: "deco-small-smooth" },
  { name: "The Needle", elementId: "deco-small-sharp" },
  { name: "Far Shore", elementId: "deco-far-shore" }
];

function renderHorizon(currentEnv) {
  const skyTop = document.getElementById("sky-stop-top");
  const skyBottom = document.getElementById("sky-stop-bottom");
  const seaTop = document.getElementById("sea-stop-top");
  const seaBottom = document.getElementById("sea-stop-bottom");
  const sunEl = document.getElementById("sun-glyph");
  const moonEl = document.getElementById("moon-glyph");
  const moonShadowEl = document.getElementById("moon-shadow-circle");
  if (!sunEl || !moonEl || !moonShadowEl) return;

  for (const decor of HORIZON_DECOR) {
    const el = document.getElementById(decor.elementId);
    if (!el) continue;
    const loc = LOCATIONS.find(l => l.name === decor.name);
    if (!loc) continue;
    if (loc.capacity === Infinity) {
      el.style.opacity = "1";
    } else {
      const effectiveCapacity = getEffectiveCapacity(decor.name, currentEnv.time);
      el.style.opacity = String(Math.max(0.15, effectiveCapacity / loc.capacity));
    }
    // Icy turns a rock white, independent of (and layered under) the
    // tide opacity above. Shores are never icy and use a different
    // base color; Iceberg keeps its own dedicated pale color rather
    // than being overridden -- both excluded here.
    if (loc.category !== "Shore" && decor.name !== "Iceberg") {
      el.style.fill = isLocationIcy(decor.name, currentEnv.time) ? "#f2f8fa" : "var(--rock-color)";
    }
  }

  // Sky/sea darken for night rather than staying a flat daytime tone
  // regardless of the hour.
  const day = isDaytime(currentEnv);
  if (skyTop) skyTop.style.stopColor = day ? "var(--sky-top)" : "var(--sky-top-night)";
  if (skyBottom) skyBottom.style.stopColor = day ? "var(--sky-bottom)" : "var(--sky-bottom-night)";
  if (seaTop) seaTop.style.stopColor = day ? "var(--sea-top)" : "var(--sea-top-night)";
  if (seaBottom) seaBottom.style.stopColor = day ? "var(--sea-bottom)" : "var(--sea-bottom-night)";

  // Sun/moon x is in the same 0-1000 unit space the background SVG's
  // viewBox uses, converted here to a left% (the SVG's width maps
  // 1:1 to the container's actual width); y is left as px since the
  // viewBox height (170) already matches the container's fixed
  // 170px height exactly, a 1:1 vertical scale regardless of the
  // container's width. Positioning these as real absolutely-placed
  // circles outside the (deliberately non-uniformly stretched) SVG
  // is what keeps them circular instead of squashed into ovals.
  const sunPos = positionOnArc(currentEnv.time, currentEnv.sunrise, currentEnv.sunset);
  if (sunPos && sunPos.visible) {
    sunEl.style.left = (sunPos.x / 10) + "%";
    sunEl.style.top = sunPos.y + "px";
    sunEl.style.opacity = "1";
  } else {
    sunEl.style.opacity = "0";
  }

  const moonPos = positionOnArc(currentEnv.time, currentEnv.moonrise, currentEnv.moonset);
  if (moonPos && moonPos.visible) {
    moonEl.style.left = (moonPos.x / 10) + "%";
    moonEl.style.top = moonPos.y + "px";
    moonEl.style.opacity = "1";

    // Phase as a crescent, computed in the moon glyph's own local
    // 40x40 viewBox (center 20,20, r=16) -- independent of the
    // horizon banner's coordinate space entirely. Two same-radius
    // circles separated by distance d: d=0 (full overlap) reads as
    // New Moon, d>=2r (no overlap) reads as Full Moon -- an
    // approximation of the illuminated-fraction curve
    // (1-cos(2*pi*phase))/2, not real terminator geometry, but a
    // recognizable crescent/gibbous shape. The shadow circle is
    // clipped to the moon disc's own boundary (see the <clipPath> in
    // the markup) so it reads as one moon with a bite taken out of
    // it, not two independent floating shapes.
    const phase = moonAgeFraction(currentEnv.time);
    const r = 16;
    const illuminatedFraction = (1 - Math.cos(2 * Math.PI * phase)) / 2;
    const d = 2 * r * illuminatedFraction;
    const direction = phase < 0.5 ? 1 : -1;
    moonShadowEl.setAttribute("cx", 20 + direction * d);
    moonShadowEl.setAttribute("cy", 20);
  } else {
    moonEl.style.opacity = "0";
  }
}

function renderReadings(currentState, currentEnv) {
  const el = document.getElementById("readings-panel");
  if (!el) return;

  const bg = composeBackgroundState(currentEnv);
  const bgHtml = `
    <div style="border:1px solid var(--border-color); border-radius:4px; padding:8px; margin-bottom:10px; background:rgba(0,0,0,0.15);">
      <h4 style="margin:0 0 4px 0; font-size:14px; color:var(--accent);">Background State</h4>
      <p style="margin:0; font-size:14px; line-height:1.6;">
        Tide: ${bg.tide}<br>
        Moon: ${bg.moon}<br>
        Sun: ${bg.sun}<br>
        ${bg.icy}
      </p>
    </div>
  `;

  const presences = currentState.world.presences || [];
  const pointColor = (p) => p > 0 ? '#22c55e' : p < 0 ? '#ef4444' : 'var(--text-muted)';
  let bodyHtml;
  if (presences.length === 0) {
    bodyHtml = `<p style="color:var(--text-muted); font-style:italic; font-size:15px;">No seals currently present.</p>`;
  } else {
    bodyHtml = presences.map(presence => {
      const seal = presence.seal;
      const d = composeDelineation(presence);
      const clauses = [d.domain, d.temperament, d.mode, d.dignity, d.sect].filter(Boolean);
      const happiness = presence.happiness || { points: 0, factors: [] };
      const company = presence.company || { points: 0, factors: [] };
      const now = currentEnv.time.getTime();
      const myEmergences = currentState.world.activeEmergences.filter(e => e.sealNumber === presence.sealNumber);

      const emergenceRows = myEmergences.map(e => {
        const start = new Date(e.created).getTime();
        const end = new Date(e.expires).getTime();
        const dur = end - start;
        return `
          <div style="border-top: 1px dashed var(--border-color); padding-top: 4px; margin-top: 4px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:13px; color:var(--text-muted);">Strength: <strong>${e.strength}</strong> | ${e.type}</span>
              <span class="badge status-${e.lifecycleState.toLowerCase()}" style="font-size:12px; padding:1px 4px;">${e.lifecycleState}</span>
            </div>
            <div style="background: rgba(0,0,0,0.15); padding: 6px; border-radius: 3px; font-family: monospace; font-size: 13px; line-height: 1.3; border: 1px solid var(--border-color); display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; margin-top:4px;">
              <div>&bull; Peak: ${now < start + dur * CONFIG.lifecycleFractions.peak ? formatCountdown((start + dur * CONFIG.lifecycleFractions.peak) - now) : "\u2713"}</div>
              <div>&bull; Fade: ${now < start + dur * CONFIG.lifecycleFractions.fading ? formatCountdown((start + dur * CONFIG.lifecycleFractions.fading) - now) : "\u2713"}</div>
              <div style="color: #ef4444; grid-column: span 2; border-top: 1px dashed var(--border-color); margin-top: 2px; padding-top: 2px;">&bull; Remaining: ${formatCountdown(end - now)}</div>
            </div>
            <button class="btn terminate-btn" data-emergence-id="${e.id}" style="font-size: 12px; border-color:#ef4444; color:#ef4444; padding: 2px; width: 100%; margin-top:4px;">Force End</button>
          </div>
        `;
      }).join("");

      return `
        <div id="reading-${seal.number}" style="border-bottom:1px solid var(--border-color); padding:8px 0;">
          <h4 style="margin:0 0 4px 0; color:var(--accent); font-size:15px;">${formatSealName(seal)} <span style="color:var(--text-muted); font-weight:normal;">#${seal.number}</span></h4>
          <p style="margin:0; font-size:14px; line-height:1.5;">${clauses.join(" ")}</p>
          <p style="margin:6px 0 0 0; font-size:13px; color:var(--text-muted);">Behaviour: <strong>${formatBehaviourLabel(presence, currentState)}</strong></p>
          <p style="margin:2px 0 0 0; font-size:13px; color:var(--text-muted);">
            Placement: <span style="color:${pointColor(happiness.points)};" title="${happiness.factors.map(f => f.label).join(', ')}">${happiness.points >= 0 ? '+' : ''}${happiness.points}</span>
            &nbsp;|&nbsp;
            Company: <span style="color:${pointColor(company.points)};">${company.points >= 0 ? '+' : ''}${company.points}</span>
          </p>
          <p style="margin:2px 0 0 0; font-size:13px; color:var(--text-muted);">${composeCompanyClauses(presence).join(" ")}</p>
          ${emergenceRows}
        </div>
      `;
    }).join("");
  }

  const aspectRows = composeAspectTable(presences);
  const aspectColor = meetingColor;
  let aspectHtml = "";
  if (presences.length >= 2) {
    aspectHtml = `
      <h4 style="margin:14px 0 4px 0; font-size:14px; color:var(--accent);">Meetings</h4>
      <table style="width:100%; border-collapse:collapse; font-size:14px;">
        <thead>
          <tr style="border-bottom:1px solid var(--border-color); text-align:left; color:var(--text-muted);">
            <th style="padding:3px 4px; font-weight:normal;">Seal</th>
            <th style="padding:3px 4px; font-weight:normal;">Seal</th>
            <th style="padding:3px 4px; font-weight:normal;">Meeting</th>
          </tr>
        </thead>
        <tbody>
          ${aspectRows.map(r => `
            <tr style="border-bottom:1px solid var(--border-color);">
              <td style="padding:3px 4px;">${formatSealName(r.sealA)} #${r.sealA.number} <span style="color:var(--text-muted);">(${r.locA})</span></td>
              <td style="padding:3px 4px;">${formatSealName(r.sealB)} #${r.sealB.number} <span style="color:var(--text-muted);">(${r.locB})</span></td>
              <td style="padding:3px 4px; color:${aspectColor(r.aspect)}; font-weight:bold;">${r.aspect}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  const tallyBy = (key) => {
    const counts = {};
    presences.forEach(p => { counts[p.seal[key]] = (counts[p.seal[key]] || 0) + 1; });
    return counts;
  };
  const tempCounts = tallyBy("temperament");
  const ageCounts = tallyBy("mode");
  const chartHtml = presences.length > 0 ? `
    <div style="margin-bottom:10px;">
      <div style="display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--text-muted); margin-bottom:4px; justify-content:center;">
        <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" id="chart-simplify" class="chart-setting" ${chartSettings.simplifyLines ? "checked" : ""}>Simplify lines</label>
        <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" id="chart-ice-tide" class="chart-setting" ${chartSettings.showIceTideMarkers ? "checked" : ""}>Ice/tide markers (I/T)</label>
        <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" id="chart-labels" class="chart-setting" ${chartSettings.showLabels ? "checked" : ""}>Place labels</label>
        <label style="display:flex; align-items:center; gap:4px;">Line weight
          <select id="chart-thickness" class="chart-setting" style="background:var(--bg-primary); color:var(--text-main); border:1px solid var(--border-color); border-radius:3px;">
            <option value="0.5" ${chartSettings.lineThickness === 0.5 ? "selected" : ""}>Thin</option>
            <option value="1" ${chartSettings.lineThickness === 1 ? "selected" : ""}>Normal</option>
            <option value="1.75" ${chartSettings.lineThickness === 1.75 ? "selected" : ""}>Thick</option>
          </select>
        </label>
      </div>
      ${renderChart(presences, currentState.world.activeEmergences, currentEnv.time)}
      <div style="display:flex; gap:10px; margin-top:6px;">
        <div style="flex:1;">${guideTable(["Temperament", "Count"], TEMPERAMENTS.map(t => [`${shapeSwatchSVG(TEMPERAMENT_SHAPE[t], "var(--text-muted)")}${t}`, tempCounts[t] || 0]))}</div>
        <div style="flex:1;">${guideTable(["Age", "Count"], MODES.map(m => [`${colorSwatchSVG(AGE_COLOR[m])}${m}`, ageCounts[m] || 0]))}</div>
      </div>
    </div>
  ` : "";

  const synthesisHtml = `
    <div style="border:1px solid var(--border-color); border-radius:4px; padding:8px; margin-bottom:10px; background:rgba(0,0,0,0.15);">
      <h4 style="margin:0 0 4px 0; font-size:14px; color:var(--accent);">Synthesis</h4>
      <p style="margin:0 0 6px 0; font-size:11px; color:var(--text-muted);">A checklist, not a ranking -- greyed rows are present but not currently notable.</p>
      ${renderSynthesisTable(composeSynthesis(currentState, currentEnv))}
    </div>
  `;

  el.innerHTML = `
    <div style="padding:10px;">
      <h3 style="margin:0 0 8px 0; font-size:16px; color:var(--accent);">Readings</h3>
      <p style="margin:0 0 10px 0; font-size:13px; color:var(--text-muted);">Mechanical delineation -- Identity, Standing, Company, and Meetings.</p>
      ${bgHtml}
      ${chartHtml}
      ${synthesisHtml}
      ${bodyHtml}
      ${aspectHtml}
    </div>
  `;
}

// Front-page digest: three status cards for the merged domains
// (Practical Life / Relationships / Self & Hidden), sitting between
// the horizon-hero scene and the coast-viewport location grid. The
// paragraph below each dot is the qualitative summary of the five
// domain omens (summarizeDomainQualitatively) -- no numbers, but
// deliberately not "voice" either: no compression, no selection of
// which fact matters most. That's separate, later work.
function renderDomainDigest(currentState) {
  const el = document.getElementById("domain-digest");
  if (!el) return;

  const digest = computeDomainDigest(currentState);
  el.innerHTML = digest.map(d => {
    const domain = FRONT_PAGE_DOMAINS.find(fd => fd.key === d.key);
    const summary = summarizeDomainQualitatively(computeDomainOmens(domain, currentState));
    return `
    <div class="domain-card">
      <div class="domain-card-head">
        <span class="domain-dot" style="background:${d.color};"></span>
        <span class="domain-card-label">${d.label}</span>
      </div>
      <p class="domain-card-stub">${summary}</p>
    </div>
  `;
  }).join("");
}

function render(currentState, currentEnv) {
  const clockEl = document.getElementById("sim-clock");
  if (clockEl) {
    clockEl.textContent = `${currentEnv.time.toLocaleDateString()} ${currentEnv.time.toLocaleTimeString()}`;
  }

  renderDomainDigest(currentState);

  const coast = document.getElementById("coast-viewport");
  if (!coast) return;

  // Querent significators surface by marking their own existing seal
  // card (if still present) or a faded ghost card at their
  // last-known location (if not) -- see locateQuerentSignificators.
  const querentMarkers = locateQuerentSignificators(currentState, currentEnv.time);
  const presentTagsBySeal = {};
  querentMarkers.filter(m => m.status === "present").forEach(m => {
    (presentTagsBySeal[m.sealNumber] = presentTagsBySeal[m.sealNumber] || new Set()).add(m.chart);
  });
  const ghostsByLocation = {};
  querentMarkers.filter(m => m.status === "ghost").forEach(m => {
    (ghostsByLocation[m.location] = ghostsByLocation[m.location] || []).push(m);
  });
  const querentChartIcon = { morning: CATEGORY_ICON.MORNING, solar: CATEGORY_ICON.SOLAR, lunar: CATEGORY_ICON.LUNAR, stochastic: "\u2022" };

  coast.innerHTML = LOCATIONS.map(loc => {
    const presencesHere = (currentState.world.presences || []).filter(p => p.location === loc.name);
    const icy = isLocationIcy(loc.name, currentEnv.time);
    const effectiveCapacity = getEffectiveCapacity(loc.name, currentEnv.time);
    const tideRestricted = effectiveCapacity < loc.capacity;
    const tideUnavailable = tideRestricted && effectiveCapacity === 0;

    let contentHtml = tideUnavailable
      ? `<p class="empty-msg" style="color: var(--accent); font-style: italic; font-size: 14px; padding: 12px; margin: 0; background: rgba(0,0,0,0.15); border: 1px dashed var(--accent-muted); border-radius: 4px;">
        Submerged
      </p>`
      : `<p class="empty-msg" style="color: var(--text-muted); font-style: italic; font-size: 14px; padding: 12px; margin: 0; background: rgba(0,0,0,0.15); border: 1px dashed var(--border-color); border-radius: 4px;">
        Empty Station
      </p>`;

    if (presencesHere.length > 0) {
      contentHtml = presencesHere.map(presence => {
        const seal = presence.seal;
        const myEmergences = currentState.world.activeEmergences.filter(e => e.sealNumber === presence.sealNumber);
        const lifecycleState = myEmergences[0]?.lifecycleState || "Active";
        const happiness = presence.happiness || { points: 0 };
        const company = presence.company || { points: 0 };
        const mood = moodLabel(happiness.points + company.points);
        const category = myEmergences[0] ? TYPE_TO_CATEGORY[myEmergences[0].type] : null;
        const icon = (category && CATEGORY_ICON[category]) || "\u{1F9AD}";
        const querentTags = [...(presentTagsBySeal[seal.number] || [])];
        const querentBadgeRow = querentTags.length > 0
          ? `<div style="display:flex; gap:3px; margin-bottom:3px;">${querentTags.map(c => `<span title="${c.charAt(0).toUpperCase() + c.slice(1)} significator" style="font-size:12px;">${querentChartIcon[c]}</span>`).join("")}</div>`
          : "";

        return `
          <div class="emergence-card-slim" data-seal-number="${seal.number}" style="cursor:pointer; border-left: 3px solid ${querentTags.length ? "#c9a227" : "var(--accent)"}; background: var(--bg-primary); padding: 8px 10px; border-radius: 4px; display:flex; align-items:center; gap:8px; min-width:min(220px, 100%); box-sizing: border-box;">
            <div style="flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:2px;">
              <span style="font-size:20px; line-height:1;">${icon}</span>
              ${sealGlyphIcon(seal)}
            </div>
            <div style="flex:1; min-width:0;">
              ${querentBadgeRow}
              <div style="font-size:14px; font-weight:bold; color:var(--accent); line-height:1.3;">${formatSealName(seal)} <span style="color:var(--text-muted); font-weight:normal;">#${seal.number}</span></div>
              <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">${formatBehaviourLabel(presence, currentState)}</div>
              <div style="font-size:12px; color:var(--text-muted);">${mood}</div>
            </div>
            <span class="badge status-${lifecycleState.toLowerCase()}" style="font-size:11px; padding:2px 5px; flex-shrink:0;">${lifecycleState}</span>
            <button type="button" class="tag-jump-btn" data-seal-number="${seal.number}" title="Tag this seal" style="flex-shrink:0; background:none; border:none; font-size:16px; padding:2px 4px; cursor:pointer; color:var(--text-muted);">\u{1F3F7}\uFE0F</button>
          </div>
        `;
      }).join("");
    }

    const ghostsHere = ghostsByLocation[loc.name] || [];
    const ghostHtml = ghostsHere.map(ghost => `
      <div class="ghost-significator-card" style="border-left: 3px dashed var(--text-muted); background: transparent; padding: 8px 10px; border-radius: 4px; display:flex; align-items:center; gap:8px; min-width:min(220px, 100%); box-sizing: border-box; opacity: 0.55;">
        <div style="flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:2px;">
          <span style="font-size:20px; line-height:1;">${querentChartIcon[ghost.chart]}</span>
          ${sealGlyphIcon(ghost.seal)}
        </div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:14px; font-weight:bold; color:var(--text-muted); line-height:1.3;">${formatSealName(ghost.seal)} <span style="font-weight:normal;">#${ghost.seal.number}</span></div>
          <div style="font-size:12px; color:var(--text-muted); font-style:italic;">${ghost.chart.charAt(0).toUpperCase() + ghost.chart.slice(1)} significator -- last seen here</div>
        </div>
      </div>
    `).join("");

    return `
      <div class="location-zone" style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 15px; align-items: center;">
        <div style="border-right: 2px solid var(--accent-muted); padding-right: 8px;">
          <h3 style="margin: 0; font-size: 16px; color: var(--accent); font-weight: bold;">${loc.name}</h3>
          <div style="min-height: 20px; margin-top: 2px;">${icy ? '<span title="Icy -- emergences here pass 50% more slowly" style="color:#7dd3fc; font-size:15px;">\u2744</span>' : ''}${tideRestricted ? ` <span title="High tide -- ${tideUnavailable ? 'unavailable (submerged)' : `capacity reduced to ${effectiveCapacity}`}" style="color:#38bdf8; font-size:15px;">${tideUnavailable ? '\u{1F30A}\u{1F30A}' : '\u{1F30A}'}</span>` : ''}</div>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">${contentHtml}${ghostHtml}</div>
      </div>
    `;
  }).join("");

  renderHorizon(currentEnv);
  renderNotifications(currentState);
  renderSealdexPanel();
  renderReadings(currentState, currentEnv);
  renderObservatory(currentState, currentEnv);
  renderJournalPanel(currentState);
}

function renderObservatory(currentState, currentEnv) {
  const obsEl = document.getElementById("observatory-panel");
  if (!obsEl) return;

  if (!observatoryInitialized) {
    obsEl.innerHTML = `
      <h2 style="border-bottom: 2px solid var(--accent); padding-bottom: 5px; font-size: 1.1rem; margin-top:0;">Observatory Controls</h2>

      <div class="collapsible-section">

        <div class="accordion-content">
          <label style="font-size:14px; color:var(--accent);">Time Multiplier:</label>
          <select id="obs-time-multiplier" style="background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--border-color); width: 100%; padding: 4px; border-radius: 4px; margin-top: 4px; margin-bottom: 8px;">
            <option value="1">1x Real-Time</option>
            <option value="60">60x Speed</option>
            <option value="288">288x Warp</option>
            <option value="1440">1440x Warp</option>

          <label style="font-size:14px; color:var(--accent); display:block; margin-bottom:2px;">Stochastic Sighting Rate (base is lunar-modulated):</label>
          <select id="obs-stochastic-rate" style="background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--border-color); width: 100%; padding: 4px; border-radius: 4px; margin-bottom: 8px;">
            <option value="0">Off</option>
            <option value="1">Low (0.5x)</option>
            <option value="2">Normal (1x)</option>
            <option value="5">High (2.5x)</option>
          </select>

          <label style="font-size:14px; color:var(--accent); display:block; margin-bottom:2px;">Morning Seal Sighting Target Time:</label>
          <input type="time" id="obs-morning-time" style="background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--border-color); width: 100%; padding: 4px; border-radius: 4px;">
        </div>
      </div>

      <div class="collapsible-section"><h3 class="accordion-header">Coordinates</h3><div class="accordion-content" style="font-size:14px;" id="val-panel-2"></div></div>
      <div class="collapsible-section"><h3 class="accordion-header">State Backup &amp; Persistence</h3><div class="accordion-content"><button class="btn btn-sm block-btn" id="obs-manual-save">Force Save State</button><button class="btn btn-sm block-btn" id="obs-clear-save" style="margin-top:4px; color:#ef4444; border-color:#ef4444;">Wipe Memory</button></div></div>
      <div class="collapsible-section"><h3 class="accordion-header">Scheduler Queue</h3><div class="accordion-content" style="font-size:13px;" id="val-panel-4"></div></div>
      <div class="collapsible-section"><h3 class="accordion-header">Querent Charts (raw facts, no voice yet)</h3><div class="accordion-content" style="font-size:13px;" id="val-panel-5"></div></div>
      <div class="collapsible-section"><h3 class="accordion-header">Domain Omens (raw facts, no voice yet)</h3><div class="accordion-content" style="font-size:13px;" id="val-panel-6"></div></div>

      <div class="collapsible-section">
        <h3 class="accordion-header">Sighting Injector</h3>
        <div class="accordion-content">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-bottom:4px;">
            <button class="btn btn-sm inject-btn" data-category="SOLAR">Solar</button>
            <button class="btn btn-sm inject-btn" data-category="LUNAR">Lunar</button>
            <button class="btn btn-sm inject-btn" data-category="MORNING">Morning</button>
            <button class="btn btn-sm inject-btn" data-category="STOCHASTIC">Stochastic</button>
          </div>
          <input type="number" id="obs-seal-override" placeholder="Seal Number Override (1-360)" style="background:var(--bg-primary); color:var(--text-main); border:1px solid var(--border-color); width:100%; box-sizing:border-box; padding:4px;">
        </div>
      </div>
    `;
    observatoryInitialized = true;
    document.getElementById("obs-time-multiplier").value = timeMultiplier;
    document.getElementById("obs-stochastic-rate").value = currentState.config.stochasticRate ?? CONFIG.stochasticRateNeutralValue;
    document.getElementById("obs-morning-time").value = currentState.config.morningSealTime ?? CONFIG.defaultMorningSealTime;
  }

  const p2 = document.getElementById("val-panel-2");
  if (p2) {
    const solar = currentState.currentSolarSeal;
    const lunar = currentState.currentLunarSeal;
    const fmt = (d) => d ? new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "\u2014";
    const locationLine = userLocation
      ? `<p style="color:#4ade80;">Location: (${userLocation.lat.toFixed(2)}, ${userLocation.lon.toFixed(2)}) -- real times</p>`
      : `<p style="color:var(--text-muted);">Location: unavailable -- placeholder times</p>`;
    p2.innerHTML = `${locationLine}<p>Sunrise: ${fmt(currentEnv.sunrise)} &middot; Sunset: ${fmt(currentEnv.sunset)}</p><p>Solar Noon: ${fmt(currentEnv.solarNoon)} &middot; Solar Midnight: ${fmt(currentEnv.solarMidnight)}</p><p>Moonrise: ${fmt(currentEnv.moonrise)} &middot; Moonset: ${fmt(currentEnv.moonset)}</p><p>Sun Position: ${currentEnv.solarPosition.sign} ${currentEnv.solarPosition.degree}\u00b0</p><p>Moon Position: ${currentEnv.lunarPosition.sign} ${currentEnv.lunarPosition.degree}\u00b0</p><p>Today's Solar Seal: ${solar ? `${formatSealName(solar)} #${solar.number}` : "\u2014"}</p><p>Today's Lunar Seal: ${lunar ? `${formatSealName(lunar)} #${lunar.number}` : "\u2014"}</p>`;
  }

  const p4 = document.getElementById("val-panel-4");
  if (p4) p4.textContent = `Queue Size: ${currentState.log.scheduledEvents.length} scheduled events.`;

  const p5 = document.getElementById("val-panel-5");
  if (p5) {
    const now = currentState.meta.currentTime || new Date();
    const charts = [
      ["Morning", computeQuerentDelta(currentState.querent.morning, currentState, now)],
      ["Solar", computeQuerentDelta(currentState.querent.solar, currentState, now)],
      ["Lunar", computeQuerentDelta(currentState.querent.lunar, currentState, now)]
    ];
    const blocks = charts.map(([name, delta]) =>
      `<p style="color:var(--accent); margin-bottom:2px;"><strong>${name}</strong></p>` +
      listQuerentFacts(name, delta).map(f => `<p style="margin:0 0 2px 0;">${f}</p>`).join("")
    );
    blocks.push(
      `<p style="color:var(--accent); margin-bottom:2px;"><strong>Stochastic</strong></p>` +
      listStochasticFacts(currentState, now).map(f => `<p style="margin:0 0 2px 0;">${f}</p>`).join("")
    );
    p5.innerHTML = blocks.join("<hr style=\"border-color:var(--border-color); margin:6px 0;\">");
  }

  const p6 = document.getElementById("val-panel-6");
  if (p6) {
    const domainBlocks = FRONT_PAGE_DOMAINS.map(domain => {
      const omens = computeDomainOmens(domain, currentState);
      const facts = listDomainOmenFacts(domain, omens);
      return `<p style="color:var(--accent); margin-bottom:2px;"><strong>${facts[0]}</strong></p>` +
        facts.slice(1).map(f => `<p style="margin:0 0 2px 0;">${f}</p>`).join("");
    });
    p6.innerHTML = domainBlocks.join("<hr style=\"border-color:var(--border-color); margin:6px 0;\">");
  }
}

let sealdexInitialized = false;

function guideTable(headers, rows) {
  return `
    <table style="width:100%; border-collapse:collapse; font-size:12px; margin-bottom:10px;">
      <thead><tr style="border-bottom:1px solid var(--border-color); text-align:left; color:var(--text-muted);">${headers.map(h => `<th style="padding:2px 4px; font-weight:normal;">${h}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr style="border-bottom:1px solid var(--border-color);">${r.map(c => `<td style="padding:2px 4px;">${c}</td>`).join("")}</tr>`).join("")}</tbody>
    </table>`;
}

function renderSealdexPanel() {
  const el = document.getElementById("sealdex-panel");
  if (!el) return;

  if (!sealdexInitialized) {
    const speciesRows = SPECIES.map(s => {
      const sig = SPECIES_SIGNIFICATION[s];
      const label = sig.secondary ? `${sig.primary} / ${sig.secondary}` : sig.primary;
      return [s, `${label} -- ${describeSpeciesSignification(sig)}`];
    });
    const temperamentRows = TEMPERAMENTS.map(t => [t, TEMPERAMENT_SIGNIFICATION[t]]);
    const modeRows = MODES.map(m => [m, MODE_SIGNIFICATION[m]]);
    const clanRows = CLANS.map(c => [c, CLAN_DIGNITY[c].domicile, CLAN_DIGNITY[c].detriment]);
    const chronotypeRows = Object.entries(LOCATION_SECT).map(([loc, sect]) => [loc, sect === "Day" ? "Day-type" : "Night-type"]);

    el.innerHTML = `
      <h2 style="border-bottom: 2px solid var(--accent); padding-bottom: 5px; font-size: 1.1rem; margin-top:0;">Sealdex</h2>

      <details style="margin-bottom:12px; border:1px solid var(--border-color); border-radius:4px; padding:6px 10px;">

        <div style="margin-top:6px;">
          <p style="font-size:12px; color:var(--text-muted); margin:0 0 4px 0;">Species -- what an appearance is about.</p>
          ${guideTable(["Species", "Means"], speciesRows)}

          <p style="font-size:12px; color:var(--text-muted); margin:0 0 4px 0;">Temperament -- the seal's own personality, regardless of where it goes or who it meets.</p>
          ${guideTable(["Temperament", "Personality"], temperamentRows)}

          <p style="font-size:12px; color:var(--text-muted); margin:0 0 4px 0;">Age -- the seal's current stage of life.</p>
          ${guideTable(["Age", "Reads as"], modeRows)}

          <p style="font-size:12px; color:var(--text-muted); margin:0 0 4px 0;">Placement -- each clan's one strong spot (Home Ground) and one weak spot (Hostile Ground); anywhere else, that clan is just on Neutral Ground.</p>
          ${guideTable(["Clan", "Home Ground", "Hostile Ground"], clanRows)}

          <p style="font-size:12px; color:var(--text-muted); margin:0 0 4px 0;">Chronotype -- Day-type or Night-type. A seal keeps to one or the other; showing up somewhere that matches is "In Rhythm," somewhere that doesn't is "Out of Rhythm." Mixed and Iceberg have no fixed chronotype -- they follow whichever seal is there.</p>
          ${guideTable(["Place", "Chronotype"], chronotypeRows)}

        </div>
